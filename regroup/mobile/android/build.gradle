// Top-level build file where you can add configuration options common to all sub-projects/modules.
//
// React Native 0.88.1 template (docs/build/react-native-0.88-upgrade.md, Task 4). AGP comes from
// the React Native Gradle plugin (9.2.1), Gradle from the wrapper (9.4.1). The 0.72-era
// workarounds that lived here are gone: the RN 0.88 plugin sets library namespaces and aligns
// Java/Kotlin targets itself, Flipper and Crashlytics are removed, and Stripe RN 0.84.0 declares
// its own native SDK (23.25.1), so the old stripeVersion pin no longer applies.

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        // RN 0.88's floor (Android 7.0). It was 23.
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // The newest 2.2.x: matches Stripe RN 0.84's StripeSdk_kotlinVersion and RN's 2.2 line
        // (the template ships 2.2.0).
        kotlinVersion = "2.2.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        // RNFirebase 26's gmsGoogleServicesGradle version.
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// AGP 9 generates BuildConfig only for modules that opt in, and fails configuration when a module
// declares buildConfigField without doing so. The React Native plugin opts in the libraries that
// apply com.facebook.react; RNFirebase 17.5 (until Task 9) and other older libraries do not.
// Opt in every library module that left the feature unset, as the 0.72 build did for all modules.
// Registered when the library plugin is applied, before AGP finalizes that module's DSL. Remove
// once CI shows no installed library needs it (decision record, Task 4).
subprojects { sub ->
    sub.pluginManager.withPlugin("com.android.library") {
        sub.extensions.getByType(com.android.build.api.variant.LibraryAndroidComponentsExtension)
            .finalizeDsl { ext ->
                if (ext.buildFeatures.buildConfig == null) {
                    ext.buildFeatures.buildConfig = true
                }
            }
    }
}
