// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        // minSdk is the OLDEST Android release the app installs on — not a
        // mirror of compileSdk. It arrived as 34 in the initial monorepo import
        // and was never revisited, which would have limited the app to Android
        // 14+ devices. 23 matches homegroups/mobile, the sibling app on the same
        // React Native and Firebase stack. The React Native 0.72 template
        // default is 21; nothing here needs more than 23 (detox declares 24 but
        // is not wired into the Gradle build in either app).
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        androidXCore = "1.6.0"
        googlePlayServicesVersion = "21.0.1"
        kotlinVersion = "1.8.10"

        // Pinned, where this used to be an unversioned classpath that resolved
        // to whatever react-native-gradle-plugin happened to bring (7.4.2).
        // 8.1.1 is the floor demanded by the transitive androidx artifacts:
        // :app:checkDebugAarMetadata failed with 68 issues, led by
        // androidx.navigation:navigation-runtime-android:2.9.7 requiring
        // "Android Gradle plugin 8.1.1 or higher".
        //
        // 8.1.1 is also the ceiling the current Gradle supports: AGP 8.1.x
        // needs Gradle 8.0+, and the wrapper here is already 8.0.1. Going
        // higher means moving the wrapper too. AGP 8 requires JDK 17 — CI
        // uses 17 (.github/workflows/ci.yml), and a local build needs
        // JAVA_HOME pointed at a 17 install, not 21.
        agpVersion = "8.1.1"

        // @stripe/stripe-react-native ships StripeSdk_stripeVersion=21.26.+ — a
        // dynamic range — so com.stripe:stripe-android resolves to whatever
        // 21.26.x is newest at build time. That is how Kotlin 2.1 metadata enters
        // this build: the resolved AAR's own com.stripe.android.* classes are
        // compiled with 2.1, which the pinned 1.8.10 compiler cannot read.
        //
        // Its android/build.gradle reads the version through
        // getExtOrDefault('stripeVersion'), which prefers rootProject.ext over its
        // own gradle.properties, so pinning here overrides it without
        // patch-package.
        //
        // Worth pinning on reproducibility grounds alone: a dynamic range means
        // this build can break with no change to this repository.
        stripeVersion = "21.26.0"

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:$agpVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        // classpath "org.jetbrains.kotlin:kotlin-scripting-common:1.7.22" 
        // classpath "org.jetbrains.kotlin:kotlin-scripting-jvm:1.7.22"
        // classpath "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:1.7.22"
    }
}

allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
		maven { url "https://maven.google.com" }
    }

    configurations.all {
        resolutionStrategy {
            // Force androidx.activity to use version 1.7.0 or higher for react-native-image-picker
            force 'androidx.activity:activity:1.7.0'
            force 'androidx.activity:activity-ktx:1.7.0'

        }
    }
}

// AGP 8 requires every Android module to declare a namespace, and ignores the
// `package` attribute in a library manifest that used to supply it. Seven
// third-party React Native modules here predate that and declare neither:
// react-native-date-picker, react-native-fs, react-native-geolocation-service,
// react-native-gesture-handler, react-native-push-notification,
// react-native-safe-area-context, react-native-vector-icons.
//
// Rather than carry seven patch-package patches, derive each namespace from
// the value its own manifest already declares. This is a bridge until those
// packages ship AGP 8 support — each one that does simply stops matching the
// `namespace == null` guard, so this block shrinks on its own and can be
// deleted once the list is empty.
// Runs in afterEvaluate, not plugins.withId: the latter fires while the
// plugin is being applied, before the module's own `android { }` block has
// been evaluated, so every namespace would read null and a module that does
// declare one would get it overwritten from its manifest.
subprojects { project ->
    project.afterEvaluate {
        def android = project.extensions.findByName('android')
        if (android == null) {
            return
        }

        // AGP 8 stops generating BuildConfig unless each module opts in, and
        // the opt-in is per module rather than inherited — setting it on :app
        // alone left the build failing while configuring
        // :react-native-community_checkbox. Opt every Android module in, rather
        // than discovering the affected ones a failed build at a time. Only
        // when unset, so a module that deliberately disabled it keeps its choice.
        if (android.buildFeatures.buildConfig == null) {
            android.buildFeatures.buildConfig = true
        }

        // @stripe/stripe-react-native enables the compose buildFeature without
        // naming a compiler version, so AGP falls back to its default 1.3.2 —
        // which demands Kotlin 1.7.20 and fails against the 1.8.10 pinned above:
        //   "This version (1.3.2) of the Compose Compiler requires Kotlin
        //    version 1.7.20 but you appear to be using Kotlin version 1.8.10"
        // 1.4.4 is the Compose Compiler release paired with Kotlin 1.8.10.
        // Keep this in step with kotlinVersion; they are a matched pair, not two
        // independent knobs.
        if (android.buildFeatures.compose) {
            android.composeOptions.kotlinCompilerExtensionVersion = '1.4.4'
        }

        if (android.namespace == null) {
            def manifest = project.file('src/main/AndroidManifest.xml')
            if (manifest.exists()) {
                def declaredPackage = new groovy.xml.XmlSlurper(false, false)
                    .parse(manifest).@package.text()
                if (declaredPackage) {
                    android.namespace = declaredPackage
                    project.logger.lifecycle(
                        "AGP8 bridge: set namespace '${declaredPackage}' for :${project.name}")
                }
            }
        }
    }
}
