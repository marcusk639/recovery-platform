// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        // minSdk is the OLDEST Android release the app installs on — not a
        // mirror of compileSdk. It arrived as 34 in the initial monorepo import
        // and was never revisited, which would have limited the app to Android
        // 14+ devices. 23 matches homegroups/mobile, the sibling app on the same
        // React Native and Firebase stack. The React Native 0.72 template
        // default is 21; nothing here needs more than 23 (detox declares 24 but
        // is not wired into the Gradle build in either app).
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        androidXCore = "1.6.0"
        googlePlayServicesVersion = "21.0.1"
        // com.stripe:stripe-android 21.26.x is compiled with Kotlin 2.1, so its
        // .class metadata carries binary version 2.1.0. A 1.8.10 compiler reads
        // 1.8.0 at most, so every com.stripe.android.* reference failed with
        // "the binary version of its metadata is 2.1.0, expected version is 1.8.0".
        //
        // Two narrower fixes were tried against the 21.26.x line specifically and
        // each is disproved by CI, so do not retry them there: forcing kotlin-stdlib
        // down (the errors are on Stripe's own classes, not the stdlib, and a
        // forced-down stdlib does not recompile a precompiled AAR — it buys a
        // runtime NoClassDefFoundError); and pinning stripe-android to a different
        // 21.26.x patch (the pin provably resolved 21.26.0 and the error persisted,
        // so the whole 21.26 line is 2.1-built). Raising the compiler is the fix
        // that addresses that mismatch rather than a symptom of it.
        //
        // This does NOT mean pinning the native SDK to a different line is off the
        // table — stripeVersion below is now pinned to 21.14.0, a line that
        // predates the 2.1 metadata problem entirely (see its comment). kotlinVersion
        // stays raised regardless: payments-core depends on kotlin-stdlib 2.1.10
        // at 21.14.0 too, just via a different path (the dependency itself, not
        // metadata on Stripe's compiled classes at 21.26.x).
        kotlinVersion = "2.1.20"

        // Pinned, where this used to be an unversioned classpath that resolved
        // to whatever react-native-gradle-plugin happened to bring (7.4.2).
        // 8.1.1 is the floor demanded by the transitive androidx artifacts:
        // :app:checkDebugAarMetadata failed with 68 issues, led by
        // androidx.navigation:navigation-runtime-android:2.9.7 requiring
        // "Android Gradle plugin 8.1.1 or higher".
        //
        // 8.1.1 is also the ceiling the current Gradle supports: AGP 8.1.x
        // needs Gradle 8.0+, and the wrapper here is already 8.0.1. Going
        // higher means moving the wrapper too. AGP 8 requires JDK 17 — CI
        // uses 17 (.github/workflows/ci.yml), and a local build needs
        // JAVA_HOME pointed at a 17 install, not 21.
        agpVersion = "8.1.1"

        // This is a three-way version pin and all three parts have to agree:
        // react-native 0.72.17 (pinned in package.json) caps
        // @stripe/stripe-react-native at 0.44.0 — 0.45.0+ extends
        // BaseReactPackage, which does not exist before RN 0.74. Wrapper 0.44.0 in
        // turn caps the native SDK below the APIs its own Kotlin source never
        // learned to handle: its own android/gradle.properties declares
        // StripeSdk_stripeVersion=21.10.+, which is the native version range it
        // was actually authored and tested against.
        //
        // Pinning higher breaks wrapper 0.44.0's compile, confirmed by bisecting
        // real com.stripe:stripe-android/payments-core/paymentsheet AARs off Maven
        // Central (not changelogs):
        //   - StripeIntent.NextActionType gains a DisplayPayNowDetails case that
        //     0.44.0's exhaustive `when` blocks (Mappers.kt, PaymentLauncherFragment.kt)
        //     don't handle — absent at 21.23.0, present at 21.24.0.
        //   - PaymentSheet.Typography gains a `custom` param gated behind the
        //     @RequiresOptIn marker AppearanceAPIAdditionsPreview, which
        //     PaymentSheetAppearance.kt calls without opting in — absent at
        //     21.14.0, present at 21.18.0.
        // 21.15.0-21.17.0 were not individually tested, so 21.14.0 is the
        // confirmed-clean choice, not necessarily the highest safe one.
        //
        // Its android/build.gradle reads the version through
        // getExtOrDefault('stripeVersion'), which prefers rootProject.ext over its
        // own gradle.properties, so pinning here overrides it without
        // patch-package. Worth pinning on reproducibility grounds alone: a dynamic
        // range means this build can break with no change to this repository.
        //
        // kotlinVersion above stays at 2.1.20 despite this: com.stripe:payments-core
        // depends on kotlin-stdlib 2.1.10 at 21.10.0 and 21.14.0 just as it does at
        // 21.26.0, so the Kotlin 2.1 metadata problem that raise fixed is not specific
        // to 21.26.0 and does not go away at this lower pin.
        stripeVersion = "21.14.0"

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:$agpVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        // classpath "org.jetbrains.kotlin:kotlin-scripting-common:1.7.22" 
        // classpath "org.jetbrains.kotlin:kotlin-scripting-jvm:1.7.22"
        // classpath "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:1.7.22"
    }
}

allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
		maven { url "https://maven.google.com" }
    }

    configurations.all {
        resolutionStrategy {
            // Force androidx.activity to use version 1.7.0 or higher for react-native-image-picker
            force 'androidx.activity:activity:1.7.0'
            force 'androidx.activity:activity-ktx:1.7.0'

        }
    }
}

// AGP 8 requires every Android module to declare a namespace, and ignores the
// `package` attribute in a library manifest that used to supply it. Seven
// third-party React Native modules here predate that and declare neither:
// react-native-date-picker, react-native-fs, react-native-geolocation-service,
// react-native-gesture-handler, react-native-push-notification,
// react-native-safe-area-context, react-native-vector-icons.
//
// Rather than carry seven patch-package patches, derive each namespace from
// the value its own manifest already declares. This is a bridge until those
// packages ship AGP 8 support — each one that does simply stops matching the
// `namespace == null` guard, so this block shrinks on its own and can be
// deleted once the list is empty.
// Runs in afterEvaluate, not plugins.withId: the latter fires while the
// plugin is being applied, before the module's own `android { }` block has
// been evaluated, so every namespace would read null and a module that does
// declare one would get it overwritten from its manifest.
subprojects { project ->
    project.afterEvaluate {
        def android = project.extensions.findByName('android')
        if (android == null) {
            return
        }

        // AGP 8 stops generating BuildConfig unless each module opts in, and
        // the opt-in is per module rather than inherited — setting it on :app
        // alone left the build failing while configuring
        // :react-native-community_checkbox. Opt every Android module in, rather
        // than discovering the affected ones a failed build at a time. Only
        // when unset, so a module that deliberately disabled it keeps its choice.
        if (android.buildFeatures.buildConfig == null) {
            android.buildFeatures.buildConfig = true
        }

        // Make Kotlin's jvmTarget follow each module's own Java target.
        //
        // Under Kotlin 1.8.10 the KGP defaulted jvmTarget to 1.8 and set
        // kotlin.jvm.target.validation.mode to `warning`. Kotlin 2.x derives
        // jvmTarget from the Gradle JVM instead (JDK 17 in CI and for AGP 8) and
        // makes that validation an `error` on Gradle 8, so three third-party
        // modules that declare Java 11 and no kotlinOptions failed the build:
        //   "Inconsistent JVM-target compatibility detected for tasks
        //    'compileDebugJavaWithJavac' (11) and 'compileDebugKotlin' (17)"
        // — react-native-safe-area-context, react-native-gesture-handler and
        // react-native-screens.
        //
        // Follow Java rather than force both to 17: each module's compileOptions
        // is its own deliberate choice, and reading it keeps modules on 1.8 and on
        // 11 both correct without a per-module list. Not
        // kotlin.jvm.target.validation.mode=warning — that silences the check
        // while leaving the mismatch it is reporting in place.
        // Read targetCompatibility through a provider, not eagerly. AGP finalizes
        // :app's compileOptions after this afterEvaluate block runs, so reading it
        // here directly fails the build with "targetCompatibility is not yet
        // finalized". A provider defers the read to when the Kotlin task actually
        // queries its jvmTarget, by which point every module has finalized.
        project.tasks
            .withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile)
            .configureEach {
                compilerOptions.jvmTarget.set(project.provider {
                    org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
                        android.compileOptions.targetCompatibility.toString())
                })
            }

        // Deliberately no Compose Compiler pin here.
        // @stripe/stripe-react-native enables the compose buildFeature
        // (node_modules/@stripe/stripe-react-native/android/build.gradle:124), and
        // at Kotlin >= 2 that same file applies
        // org.jetbrains.kotlin.plugin.compose (lines 16-21, 65-68), which supplies
        // the Compose Compiler from the Kotlin version itself. Setting
        // composeOptions.kotlinCompilerExtensionVersion alongside that plugin pins
        // a second, Kotlin-1.8-era compiler against a 2.1 one. The override that
        // stood here ('1.4.4', matched to kotlinVersion 1.8.10) is therefore wrong
        // under Kotlin 2 rather than merely redundant.

        if (android.namespace == null) {
            def manifest = project.file('src/main/AndroidManifest.xml')
            if (manifest.exists()) {
                def declaredPackage = new groovy.xml.XmlSlurper(false, false)
                    .parse(manifest).@package.text()
                if (declaredPackage) {
                    android.namespace = declaredPackage
                    project.logger.lifecycle(
                        "AGP8 bridge: set namespace '${declaredPackage}' for :${project.name}")
                }
            }
        }
    }
}
