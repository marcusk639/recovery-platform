apply plugin: "com.android.application"
// Needed even without Kotlin sources: it adds the org.jetbrains.kotlin.platform.type
// = androidJvm attribute, without which Gradle resolves AndroidX Lifecycle 2.8+ to
// its -desktop variant (no ReportFragment). Variant resolution is not build-type
// specific and the app crashed at launch (release is where it was observed).
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services' // <- Add this line

import com.android.build.OutputFile

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/react-native-codegen
    // codegenDir = file("../node_modules/react-native-codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    //
    //   --reset-cache: babel.config.js inlines env values (BUNDLED_ENV), and
    //   Metro's transform cache key does not include them. Without this, a
    //   release bundle built after an e2e one could reuse transforms with
    //   E2E_VARIANT baked in. Every bundled variant pays a cold transform.
    extraPackagerArgs = ["--reset-cache"]

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to create four separate APKs instead of one,
 * one for each native architecture. This is useful if you don't
 * use App Bundles (https://developer.android.com/guide/app-bundle/)
 * and want to have separate APKs to upload to the Play Store.
 */
def enableSeparateBuildPerCPUArchitecture = false

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * Private function to get the list of Native Architectures you want to build.
 * This reads the value from reactNativeArchitectures in your gradle.properties
 * file and works together with the --active-arch-only flag of react-native run-android.
 */
def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply from: "../../node_modules/@sentry/react-native/sentry.gradle"
android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.rats.dev"

    // AGP 8 stops generating BuildConfig unless asked. MainApplication.java
    // reads BuildConfig.DEBUG, IS_NEW_ARCHITECTURE_ENABLED and IS_HERMES_ENABLED,
    // so without this the app module no longer compiles.
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.regroup.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 39
        versionName "0.55"
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false  // If true, also generate a universal APK
            include (*reactNativeArchitectures())
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        // E2E build types: release builds (JS bundled with Hermes, no Metro,
        // not debuggable) with their own package and Firebase config, signed
        // with the debug key. E2E_VARIANT is set per variant on the bundle
        // task below. Each one's google-services.json lives in its source set:
        //   e2eEmulator: src/e2eEmulator/google-services.json, committed, for
        //                the emulator-only project demo-regroup-e2e.
        //   e2eStaging:  copied from ~/.config/regroup-e2e at build time
        //                (copyE2eStagingGoogleServices), gitignored.
        e2eEmulator {
            initWith release
            applicationIdSuffix ".e2e.emu"
            // Tells the three installed apps apart on a device.
            resValue "string", "app_name", "Regroup e2e emu"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        e2eStaging {
            initWith release
            applicationIdSuffix ".e2e.stg"
            // Tells the three installed apps apart on a device.
            resValue "string", "app_name", "Regroup e2e stg"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    // A build type only gets src/<buildType>; initWith copies settings, not
    // sources. Both e2e types need release's no-op ReactNativeFlipper.
    sourceSets {
        e2eEmulator.java.srcDirs += 'src/release/java'
        e2eStaging.java.srcDirs += 'src/release/java'
    }



    // applicationVariants are e.g. debug, release
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            // For each separate APK per architecture, set a unique version code as described here:
            // https://developer.android.com/studio/build/configure-apk-splits.html
            // Example: versionCode 1 will generate 1001 for armeabi-v7a, 1002 for x86, etc.
            def versionCodes = ["armeabi-v7a": 1, "x86": 2, "arm64-v8a": 3, "x86_64": 4]
            def abi = output.getFilter(OutputFile.ABI)
            if (abi != null) {  // null for the universal-debug, universal-release variants
                output.versionCodeOverride =
                        defaultConfig.versionCode * 1000 + versionCodes.get(abi)
            }

        }
    }
}

// E2E_VARIANT reaches babel.config.js only through the bundler's environment.
// The React Native Gradle plugin (0.72) has no per-variant env setting, so every
// bundled variant runs node through `env`: the e2e ones with E2E_VARIANT set to
// their variant, every other one (release) with it removed, so a value exported
// in the build shell (`E2E_VARIANT=emulator ./gradlew assembleRelease`) cannot
// reach a store bundle. A value in .env is refused by babel.config.js itself.
// It is a task input, so changing it re-runs the bundle. Debug variants have no
// bundle task (Metro serves them).
//
// This must configure the task after the plugin's own register action, which
// sets nodeExecutableAndArgs and would overwrite an earlier configureEach. The
// plugin registers the task in its onVariants callback; this callback is added
// later, so it runs later, and tasks.named(...).configure then runs last.
def e2eBundleVariants = [e2eEmulator: "emulator", e2eStaging: "staging"]
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def bundleTask = "createBundle${variant.name.capitalize()}JsAndAssets"
    if (!tasks.names.contains(bundleTask)) {
        return
    }
    def e2eVariant = e2eBundleVariants[variant.name]
    def node = e2eVariant != null ?
        ["env", "E2E_VARIANT=${e2eVariant}".toString(), "node"] :
        ["env", "-u", "E2E_VARIANT", "node"]
    tasks.named(bundleTask).configure { task ->
        task.nodeExecutableAndArgs.set(node)
    }
}

// e2e builds never upload source maps to the production Sentry project (their
// JS also has Sentry disabled; see src/config/sentry.ts). sentry.gradle sets
// `enabled true` in its own register action, which can run after this, so
// `enabled = false` does not stick; an onlyIf predicate is ANDed with Sentry's
// own and holds whatever the order.
tasks.matching { it.name ==~ /createBundleE2e.*_SentryUpload_.*/ }.configureEach {
    onlyIf("e2e builds never upload to Sentry") { false }
}

// e2eStaging's Firebase config is for the real regroup-e2e project, so it stays
// out of git: it is copied in before every e2eStaging build and the build fails
// without it. Never falls back to app/google-services.json (phoenix-cleanhouse).
// -PregroupE2eStagingGoogleServices=<path> overrides the source.
def e2eStagingGoogleServicesSource = file(
    project.findProperty("regroupE2eStagingGoogleServices") ?:
        "${System.getProperty('user.home')}/.config/regroup-e2e/google-services.e2e-staging.json")
def e2eStagingGoogleServicesTarget = file("src/e2eStaging/google-services.json")
def copyE2eStagingGoogleServices = tasks.register("copyE2eStagingGoogleServices") {
    inputs.property("source", e2eStagingGoogleServicesSource.absolutePath)
    outputs.file(e2eStagingGoogleServicesTarget)
    outputs.upToDateWhen { false }
    doLast {
        if (!e2eStagingGoogleServicesSource.isFile()) {
            e2eStagingGoogleServicesTarget.delete()
            throw new GradleException(
                "e2eStaging needs its Firebase config at ${e2eStagingGoogleServicesSource}: " +
                "the google-services.json of the Android app com.regroup.app.e2e.stg " +
                "in Firebase project regroup-e2e. It is not committed.")
        }
        e2eStagingGoogleServicesTarget.parentFile.mkdirs()
        e2eStagingGoogleServicesTarget.bytes = e2eStagingGoogleServicesSource.bytes
    }
}
tasks.matching { it.name in ["preE2eStagingBuild", "processE2eStagingGoogleServices"] }.configureEach {
    dependsOn copyE2eStagingGoogleServices
}

buildscript {
    repositories {
        mavenCentral()
        maven { url "https://maven.google.com" }
    }
}

allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
        maven { url "https://maven.google.com" }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.0.0")
    implementation 'androidx.appcompat:appcompat:1.3.1'

    implementation 'com.google.android.gms:play-services-location:21.0.1'
    
    // Fix for react-native-image-picker - requires androidx.activity 1.6.0+
    implementation "androidx.activity:activity:1.7.0"
    implementation "androidx.activity:activity-ktx:1.7.0"

    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }

    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

}

