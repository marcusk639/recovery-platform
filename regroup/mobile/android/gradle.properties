# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# A one-commit bump to -Xmx6144m/1536m plus org.gradle.workers.max=2 (CI run
# 37498916808, commit 88fb0b8) was meant to address an OutOfMemoryError seen in an
# earlier run. That run failed, but not with the OOM it targeted -- it failed on a
# genuine Kotlin compile error in @stripe/stripe-react-native's own source, a version
# mismatch against the stripeVersion pin in android/build.gradle (now fixed there),
# not a memory or concurrency problem. The -Xmx bump bought nothing and is reverted
# back to the 4096m/1024m baseline above.
#
# org.gradle.workers.max=2 is kept, but recharacterized: it is not a memory fix, it is
# a DIAGNOSTIC necessity. Unbounded worker concurrency let the real compile error above
# get preempted by an unrelated OOM in a different module before
# :stripe_stripe-react-native:compileDebugKotlin could finish and report it — "no
# error" on that task meant "did not finish", not "passed". Capping concurrency is what
# let the task run to completion and surface the actual failure instead of a misleading
# OOM. Revisit once the build gets past that compile error: whether memory tuning is
# still needed at all is only answerable from there, measured against the free -h/nproc
# diagnostic in .github/workflows/ci.yml, not assumed.
org.gradle.workers.max=2

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Version of flipper SDK to use with React Native
FLIPPER_VERSION=0.182.0

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true


# Release signing config (MYAPP_UPLOAD_STORE_FILE/KEY_ALIAS/STORE_PASSWORD/KEY_PASSWORD)
# is intentionally NOT defined here. build.gradle's release signingConfig only activates
# when project.hasProperty('MYAPP_UPLOAD_STORE_FILE') is true. Real values (once a real
# upload keystore exists) do NOT belong in this file. The only mechanism that actually
# works today without further build.gradle changes is ORG_GRADLE_PROJECT_<name>
# environment variables (or an equivalent CI secret injection) — Gradle exposes those
# directly as project properties. NOTE: android/local.properties is gitignored, but
# nothing in build.gradle loads its keys as project properties (the Android Gradle Plugin
# only reads it for sdk.dir/ndk.dir), so putting these values there has no effect — same
# problem as the reserved-but-unwired `android/keystore.properties` path (gitignored, see
# .gitignore): a Properties-file load would need to be added to build.gradle before
# either path does anything.
