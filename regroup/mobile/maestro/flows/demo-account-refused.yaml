# S5 (REV-A8): the shared App Review demo account can look around its demo
# house, and is refused what changes state or costs money.
# Persona: the demo account the landing screen's Demo link signs in to
# (seeded by maestro/scripts/seed/demoHouse.js with the demo: true claim).
# 1. The Demo link signs in and shows the demo house.
# 2. House settings is refused in the app ("disabled in demo mode").
# 3. The server refuses it too, whatever the app does: createInvitation answers
#    PERMISSION_DENIED with the same words, and a Storage upload is refused.
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/demo-account-refused.yaml
appId: ${APP_ID}
tags:
  - demo
  - security
---
- runFlow: ../subflows/guard-e2e-app.yaml
- launchApp:
    clearState: true
    arguments:
      IS_E2E_TEST: "1"
- extendedWaitUntil:
    visible:
      id: "initial-landing-screen"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "landing-demo-link"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "landing-demo-link"
- extendedWaitUntil:
    visible:
      id: "main-app-screen"
    timeout: 60000
- extendedWaitUntil:
    visible: "E2E Demo House"
    timeout: 30000
- tapOn:
    id: "house-settings-button"
- extendedWaitUntil:
    visible: ".*disabled in demo mode.*"
    timeout: 15000
- runScript:
    file: ../scripts/maestro-js/demo-server-refusals.js
- assertTrue:
    condition: ${output.signedIn}
    label: the demo account signs in to the emulator
- assertTrue:
    condition: ${output.inviteStatus === 'PERMISSION_DENIED'}
    label: createInvitation refuses the demo account
- assertTrue:
    condition: ${output.inviteMessage === 'This functionality is disabled in demo mode.'}
    label: with the app's demo wording
- assertTrue:
    condition: ${output.uploadStatus === '403'}
    label: Storage refuses an upload by the demo account
- runFlow:
    file: ../subflows/logout.yaml
