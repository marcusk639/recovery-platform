# Flow 02 — Signup (new account)
# Unauthenticated. Creates a new account via the landing -> login -> signup path.
# Emulator is reset by reset-and-seed.sh before each run, so the email is free.
# Run: maestro test -e APP_ID=com.rats.dev maestro/flows/signup.yaml
#
# NOTE: Inputs are inside KeyboardAwareScrollView which does not expose testIDs
# to the iOS accessibility tree. Use text-label selectors for form fields.
appId: ${APP_ID}
tags:
  - auth
  - signup
---
- launchApp:
    clearState: true
    arguments:
      IS_E2E_TEST: "1"
- extendedWaitUntil:
    visible:
      id: "initial-landing-screen"
    timeout: 30000
# Reach the login screen, then the signup screen.
- tapOn:
    id: "sign-in-button"
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "signup-link"
- extendedWaitUntil:
    visible:
      id: "signup-screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Let's Get Started"
    timeout: 10000
# Fill the signup form by label text (testIDs not accessible inside KeyboardAwareScrollView on iOS).
# Tap the next field to dismiss the keyboard — never hideKeyboard.
- tapOn:
    text: "Email"
- inputText: "e2e-signup@rats-e2e.com"
- tapOn:
    text: "Password"
- inputText: "TestPassword123!"
- tapOn:
    text: "SIGN UP"
# Guest/admin signup routes to NewAccount; manager routes to OrgSetup. Accept either.
- extendedWaitUntil:
    visible:
      id: "new-account-screen"
    timeout: 60000
    optional: true
- assertVisible:
    id: "org-setup-screen"
    optional: true
