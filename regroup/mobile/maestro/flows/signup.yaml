# Flow 02 — Signup (new account)
# Unauthenticated. Creates a new account via the landing -> login -> signup path.
# Emulator is reset by reset-and-seed.sh before each run, so the email is free.
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/signup.yaml
#
# Fills every field by testID (RN 0.88 + react-native-keyboard-controller expose
# them on iOS too), ticks the terms box, and requires landing on NewAccount or
# OrgSetup. Before 2026-11-06 the flow filled two fields by label, never ticked
# the terms box, and made the landing optional, so it never proved signup.
appId: ${APP_ID}
tags:
  - auth
  - signup
---
- runFlow: ../subflows/guard-e2e-app.yaml
- launchApp:
    clearState: true
    arguments:
      IS_E2E_TEST: "1"
- extendedWaitUntil:
    visible:
      id: "initial-landing-screen"
    timeout: 30000
# Reach the login screen, then the signup screen.
- tapOn:
    id: "sign-in-button"
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "signup-link"
- extendedWaitUntil:
    visible:
      id: "signup-screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Let's Get Started"
    timeout: 10000
# Fill every field by testID. Wait out the keyboard-controller scroll before typing,
# and dismiss the keyboard before the next field so taps land where they aim.
- scrollUntilVisible:
    element:
      id: "signup-email-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "signup-email-input"
- waitForAnimationToEnd
- inputText: "e2e-signup@rats-e2e.com"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "signup-password-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "signup-password-input"
- waitForAnimationToEnd
- inputText: ${E2E_TEST_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "signup-confirm-password-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "signup-confirm-password-input"
- waitForAnimationToEnd
- inputText: ${E2E_TEST_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "signup-first-name-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "signup-first-name-input"
- waitForAnimationToEnd
- inputText: "Emma"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "signup-last-name-input"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "signup-last-name-input"
- waitForAnimationToEnd
- inputText: "Tester"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "terms-of-service-checkbox"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "terms-of-service-checkbox"
- tapOn:
    id: "signup-button"
# Guest/admin signup routes to NewAccount; manager routes to OrgSetup. One of them must appear.
- extendedWaitUntil:
    visible:
      id: "new-account-screen|org-setup-screen"
    timeout: 60000
