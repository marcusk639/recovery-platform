# Flow 22 — Guest: payment history (read-only)
# Persona: guest-a, who has seeded payments of their own. Another resident's must not show.
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/guest-payment-history.yaml
appId: ${APP_ID}
tags:
  - guest
  - payments
---
- runFlow: ../subflows/guard-e2e-app.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-guest-a@rats-e2e.com
      PASSWORD: ${E2E_TEST_PASSWORD}
- tapOn:
    id: "guest-tab"
- extendedWaitUntil:
    visible:
      id: "guest-overview-screen"
    timeout: 30000
# Below the fold once this week's compliance breakdown shows, and a tap near the
# bottom edge lands on the tab bar instead.
- scrollUntilVisible:
    element:
      id: "payment-history-card"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "payment-history-card"
- extendedWaitUntil:
    visible:
      id: "payment-history-screen"
    timeout: 30000
# This resident's two seeded payments, and not another resident's. Wait for the
# first: on Android the list can show "No payments found." for a moment before
# the records arrive (seen 2026-11-25), so an immediate assert raced it.
- extendedWaitUntil:
    visible:
      id: "payment-row-e2e-pay-a-latest"
    timeout: 20000
- assertVisible:
    text: ".*22[.]22.*"
- assertVisible:
    id: "payment-row-e2e-pay-a-old"
- assertVisible:
    text: ".*11[.]11.*"
- assertNotVisible:
    id: "payment-row-e2e-pay-b"
- assertNotVisible:
    id: "payment-history-empty"
# The seeded rent charge (seed docs.js rentCharges) shows beside the payments,
# so the resident sees why the balance went up (rent spec §4.5, launch plan Task 24).
- scrollUntilVisible:
    element:
      id: "charge-row-guest-a_2026-11-16"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Rent, Nov 16–22"
- assertVisible:
    text: ".*175[.]00.*"
- runFlow:
    file: ../subflows/logout.yaml
