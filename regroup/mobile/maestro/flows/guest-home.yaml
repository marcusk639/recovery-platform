# Flow 11 — Guest: home dashboard renders with stat cards
# Persona: guest-a (resident of test-house-123).
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/guest-home.yaml
appId: ${APP_ID}
tags:
  - guest
---
- runFlow: ../subflows/guard-e2e-app.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-guest-a@rats-e2e.com
      PASSWORD: ${E2E_TEST_PASSWORD}
# Login lands on the tab bar; switch to the Guest tab.
- tapOn:
    id: "guest-tab"
- extendedWaitUntil:
    visible:
      id: "guest-overview-screen"
    timeout: 30000
# Core resident stat cards.
- assertVisible:
    id: "meetings-card"
- assertVisible:
    id: "chores-card"
# Required: on RN 0.88 this card collapsed to its padding while the element
# still existed, so the header text is what proves it rendered.
- assertVisible:
    id: "week-summary-card"
- assertVisible:
    text: "HEALTH SCORE"
- runFlow:
    file: ../subflows/logout.yaml
