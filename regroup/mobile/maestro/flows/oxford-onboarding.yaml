# Flow 26 — Oxford: onboarding wizard
# Persona: oxford operator (admin of test-house-oxford-new, not onboarded yet).
#
# The wizard renders only while the house has oxfordOnboardingComplete===false.
# The seed (maestro/scripts/seed/index.js) creates test-house-oxford-new that way
# for this flow, and keeps test-house-oxford onboarded for the dashboard flow 31.
# The flow completes the wizard, so re-seed (reset-and-seed.sh) before a rerun.
#
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/oxford-onboarding.yaml
appId: ${APP_ID}
tags:
  - oxford
  - onboarding
---
- runFlow: ../subflows/guard-e2e-app.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-oxford-new@rats-e2e.com
      PASSWORD: ${E2E_TEST_PASSWORD}
- extendedWaitUntil:
    visible:
      id: "main-app-screen"
    timeout: 30000
# Enter the Oxford hub; with onboarding incomplete the wizard is presented.
- scrollUntilVisible:
    element:
      text: ".*Oxford House Hub.*"
    direction: DOWN
    centerElement: true
- tapOn:
    text: ".*Oxford House Hub.*"
# Wizard step 1 of 5.
- extendedWaitUntil:
    visible:
      id: "wizard-step-1"
    timeout: 30000
# Advance through the 5 steps. The wizard's nav button is the shared
# setup-buttons-next control (its label becomes "Finish" on the last step);
# there is no dedicated button-finish testID (see MISSING TESTIDS in report).
- assertVisible:
    id: "wizard-step-1"
- tapOn:
    id: "setup-buttons-next"
- assertVisible:
    id: "wizard-step-2"
- tapOn:
    id: "setup-buttons-next"
- assertVisible:
    id: "wizard-step-3"
# The first business meeting is required: Next stays disabled without a date and time.
- tapOn:
    id: "wizard-date-display"
- extendedWaitUntil:
    visible:
      text: "Confirm"
    timeout: 10000
- tapOn:
    text: "Confirm"
- waitForAnimationToEnd
- tapOn:
    text: "19:00"
- inputText: "19:00"
- waitForAnimationToEnd
- tapOn:
    id: "setup-buttons-next"
- assertVisible:
    id: "wizard-step-4"
# The weekly dues amount is required too.
- tapOn:
    text: "0.00"
- inputText: "5.00"
- waitForAnimationToEnd
- tapOn:
    id: "setup-buttons-next"
- assertVisible:
    id: "wizard-step-5"
# Last step: the same next control finishes the wizard ("Finish" label).
- tapOn:
    id: "setup-buttons-next"
# Completion lands on the Oxford dashboard.
- extendedWaitUntil:
    visible:
      id: "oxford-dashboard-content"
    timeout: 30000
- runFlow:
    file: ../subflows/logout.yaml
