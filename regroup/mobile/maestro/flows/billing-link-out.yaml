# Billing link-out (launch P5 Task 9, BILL-020): a lapsed operator's
# "Manage Subscription" opens web billing in the system browser, never an
# in-app WebView.
# Persona: lapsed-operator (house test-house-lapsed, subscriptionStatus canceled).
#
# Maestro can't read the browser. Leaving the app is the evidence: after the
# tap neither the app's screen nor its old WebView test ID is visible.
#
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/billing-link-out.yaml
appId: ${APP_ID}
tags:
  - operator
  - billing
---
- runFlow: ../subflows/guard-e2e-app.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-lapsed-operator@rats-e2e.com
      PASSWORD: ${E2E_TEST_PASSWORD}
      LANDING_ID: subscription-required-screen
- tapOn:
    id: btn-manage-subscription
- extendedWaitUntil:
    notVisible:
      id: subscription-required-screen
    timeout: 10000
- assertNotVisible:
    id: subscription-webview
# Back to the app: the plan is still lapsed, so the gate still blocks.
- launchApp:
    appId: ${APP_ID}
- extendedWaitUntil:
    visible:
      id: subscription-required-screen
    timeout: 20000
# Sign out so the next flow starts signed out (clearState keeps the iOS keychain).
- tapOn:
    text: "Sign out"
- extendedWaitUntil:
    visible:
      id: initial-landing-screen
    timeout: 30000
