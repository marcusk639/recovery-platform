# Deep link: an invitation link on the legacy scheme com.rats.dev:// (legacy
# parameter form), opened with the app cold and signed out, is still accepted:
# signup shows the invitation (testID invitation-info) and the invited email.
# isValidDeepLink in services/native-deep-links.ts accepts the scheme.
# Run: maestro/scripts/run-flows.sh deep-link-legacy-scheme
appId: ${APP_ID}
tags:
  - links
---
- runFlow: ../subflows/guard-e2e-app.yaml
- launchApp:
    clearState: true
    arguments:
      IS_E2E_TEST: "1"
- extendedWaitUntil:
    visible:
      id: "initial-landing-screen"
    timeout: 30000
# Cold: stop the app so the link starts it.
- stopApp
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "com.rats.dev://?type=invitation&invitationType=guest&house=test-house-123&inviter=test-manager&email=e2e-invitee%40rats-e2e.com&owner=&initialPhase="
# The app routes an invitation link straight to signup, with the invitation
# shown and the invited email filled in.
- extendedWaitUntil:
    visible:
      id: "invitation-info"
    timeout: 30000
- assertVisible:
    text: "e2e-invitee@rats-e2e.com"
