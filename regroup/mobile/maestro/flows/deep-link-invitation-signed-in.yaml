# Deep link: an invitation link opened while signed in. Logs in as
# test-guest-a@rats-e2e.com, then opens the link. Today nothing handles a link
# for a signed-in user (Splash only queues the invitation), so the app is
# expected to stay on the house tab and never show invitation-info; the
# assertion below records the behaviour the app has now, so this flow's
# result is the baseline: it FAILS while no signed-in route exists.
# LINK: the url to open, default is the token form. Override with
#   -e LINK='regroup-app://?type=invitation&invitationType=guest&house=…&email=…'
#   -e LINK='com.rats.dev://?type=invitation&token=e2e-invite-token-1'
# Run: maestro/scripts/run-flows.sh deep-link-invitation-signed-in
appId: ${APP_ID}
tags:
  - links
---
- runFlow: ../subflows/guard-e2e-app.yaml
- evalScript: "${output.link = typeof LINK === 'undefined' ? 'regroup-app://?type=invitation&token=e2e-invite-token-1' : LINK}"
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-guest-a@rats-e2e.com
      PASSWORD: ${E2E_TEST_PASSWORD}
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ${output.link}
# A signed-in user should be told about the invitation. Expected today: no
# screen shows it, so this times out.
- extendedWaitUntil:
    visible:
      id: "invitation-info"
    timeout: 15000
