# Flow 21 — Guest: rent payment up to the Stripe boundary
# Persona: guest-a. Asserts the balance breakdown renders; STOPS before "Pay Now".
# Stripe Checkout (checkout.stripe.com) is NOT emulated — do not complete payment
# here. To test completion, run the functions emulator with Stripe test keys.
# Run: maestro test -e APP_ID=com.rats.dev maestro/flows/guest-rent-payment.yaml
appId: ${APP_ID}
tags:
  - guest
  - payments
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-guest-a@rats-e2e.com
      PASSWORD: TestPassword123!
- tapOn:
    id: "guest-tab"
- extendedWaitUntil:
    visible:
      id: "guest-overview-screen"
    timeout: 30000
- tapOn:
    id: "pay-rent-card"
- extendedWaitUntil:
    visible:
      id: "rent-payment-screen"
    timeout: 30000
# Either the balance breakdown (Stripe connected) or the not-connected gate renders.
- assertVisible:
    id: "balance-card"
    optional: true
- assertVisible:
    id: "stripe-not-connected"
    optional: true
# Boundary: do NOT tap pay-now-button (would leave the app for Stripe Checkout).
- runFlow:
    file: ../subflows/logout.yaml
