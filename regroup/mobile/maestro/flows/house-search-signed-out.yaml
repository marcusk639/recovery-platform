# EMU-009, AUTH-008 — A signed-out visitor finds a house near them and opens
# its summary. They read the public listings (house-listings), which the
# server writes from each house; houses/{id} stays members-only. The summary
# shows no street address.
# With location granted and the device in Austin, the seeded E2E Test House
# (whose listing onHouseListingSync writes when the seed creates it) is listed.
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/house-search-signed-out.yaml
appId: ${APP_ID}
tags:
  - signed-out
  - search
---
- runFlow: ../subflows/guard-e2e-app.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: inuse
            notifications: allow
          arguments:
            IS_E2E_TEST: "1"
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: allow
            notifications: allow
          arguments:
            IS_E2E_TEST: "1"
- setLocation:
    latitude: 30.2672
    longitude: -97.7431
- extendedWaitUntil:
    visible:
      id: "initial-landing-screen"
    timeout: 30000
- tapOn:
    id: "landing-role-guest"
- tapOn:
    id: "nav-house-search"
- extendedWaitUntil:
    visible:
      id: "house-search-screen"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "house-card-test-house-123"
    timeout: 30000
- assertVisible: ".*E2E Test House.*"
- assertNotVisible: ".*100 Test St.*"
- tapOn:
    id: "house-details-button-test-house-123"
# The summary, from the listing: name, openings, and the APPLY button.
- extendedWaitUntil:
    visible:
      id: "apply-button"
    timeout: 30000
- assertVisible: ".*OPENINGS.*"
- assertNotVisible: ".*100 Test St.*"
- assertNotVisible: ".*HOUSE HEALTH.*"
