# Flow 09 — Operator: applications review -> approve -> intake
# Persona: manager (admin of test-house-123). Seeded: pending application
# test-app-1 (maestro/scripts/seed/docs.js application()).
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/operator-applications.yaml
appId: ${APP_ID}
tags:
  - operator
  - applications
---
- runFlow: ../subflows/guard-e2e-app.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-manager@rats-e2e.com
      PASSWORD: ${E2E_TEST_PASSWORD}
# Login lands on the House tab (HouseSummary).
- extendedWaitUntil:
    visible:
      id: "main-app-screen"
    timeout: 30000
# The "Applications" section has no testID — tap by its label text.
- scrollUntilVisible:
    element:
      text: ".*Review resident applications.*"
    direction: DOWN
    centerElement: true
- tapOn:
    text: ".*Review resident applications.*"
# ApplicationListScreen renders one row per seeded application.
- extendedWaitUntil:
    visible:
      id: "app-row-test-app-1"
    timeout: 30000
- tapOn:
    id: "app-row-test-app-1"
# ApplicationDetailScreen exposes btn-approve / btn-reject.
- assertVisible:
    id: "btn-approve"
- tapOn:
    id: "btn-approve"
# Approve asks for confirmation in a native alert.
- extendedWaitUntil:
    visible:
      text: "Approve"
    timeout: 15000
- tapOn:
    text: "Approve"
# Approval routes the operator into the resident intake form.
- extendedWaitUntil:
    visible:
      id: "intake-form-screen"
    timeout: 30000
- runFlow:
    file: ../subflows/logout.yaml
