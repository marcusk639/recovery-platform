# Flow 05 — Operator: house summary -> manage guests
# Persona: manager (admin of test-house-123). Seeded: guest-a, guest-b residents.
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/operator-manage-guests.yaml
appId: ${APP_ID}
tags:
  - operator
  - guests
---
- runFlow: ../subflows/guard-e2e-app.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-manager@rats-e2e.com
      PASSWORD: ${E2E_TEST_PASSWORD}
# Login lands on the House tab (HouseSummary).
- extendedWaitUntil:
    visible:
      id: "main-app-screen"
    timeout: 30000
# The guest tab opens on a resident. It used to read "No guests in this house"
# until the operator picked one elsewhere, because nothing was selected.
- tapOn:
    id: "guest-tab"
- extendedWaitUntil:
    visible:
      id: "guest-overview-screen"
    timeout: 30000
- tapOn:
    id: "house-tab"
- extendedWaitUntil:
    visible:
      id: "main-app-screen"
    timeout: 30000
- assertVisible:
    id: "manage-guests-button"
- tapOn:
    id: "manage-guests-button"
- extendedWaitUntil:
    visible:
      id: "guest-list-screen"
    timeout: 30000
# At least one seeded resident is listed.
- assertVisible:
    id: "guest-list-item"
- runFlow:
    file: ../subflows/logout.yaml
