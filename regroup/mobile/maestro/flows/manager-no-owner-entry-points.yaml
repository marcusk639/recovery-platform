# OPS-042 — A manager (staff of the house, not its owner) doesn't see the
# owner's entry points: no Add Home on Profile, and in House Settings no
# Details, Managers, Admin Management or Payments (Stripe Connect setup, whose
# callables accept only owners). Managers do get the House Settings gear
# (owner decision 2026-11-27, #308: `house:settings`, owners and managers,
# context/rules.ts); the owner's rows inside stay behind `house:full-edit`, and
# each owner screen also refuses a manager itself (RequireHouseRole). The
# manager still runs the house: Drug Testing, Resident Intake and Applications
# show, and so does the Rent entry in House Settings.
# Persona: test-staff-manager, the admin claim on test-house-123 with a
# house-roles tier of manager (maestro/scripts/seed/docs.js staff()).
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/manager-no-owner-entry-points.yaml
appId: ${APP_ID}
tags:
  - manager
  - roles
---
- runFlow: ../subflows/guard-e2e-app.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-staff-manager@rats-e2e.com
      PASSWORD: ${E2E_TEST_PASSWORD}
- extendedWaitUntil:
    visible:
      id: "main-app-screen"
    timeout: 30000
# House tab: staff sections.
- scrollUntilVisible:
    element:
      id: "applications-section"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "drug-testing-section"
- assertVisible:
    id: "intake-section"
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
# The gear opens House Settings for a manager, without the owner's rows.
- extendedWaitUntil:
    visible:
      id: "house-settings-button"
    timeout: 15000
- tapOn:
    id: "house-settings-button"
- extendedWaitUntil:
    visible:
      id: "house-settings-screen"
    timeout: 15000
- assertVisible: "Chores"
- assertNotVisible: "Details"
- assertNotVisible:
    id: "managers-section"
- assertNotVisible: "Admin Management"
- scrollUntilVisible:
    element:
      id: "rent-settings-section"
    direction: DOWN
    timeout: 15000
- assertNotVisible: "Payments"
- tapOn: "Done"
- extendedWaitUntil:
    visible:
      id: "main-app-screen"
    timeout: 15000
# Profile: no Add Home.
- tapOn:
    id: "profile-tab"
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Delete account.*"
    direction: DOWN
    timeout: 15000
- assertNotVisible: ".*Add Home.*"
- assertVisible: ".*My Profile.*"
- runFlow:
    file: ../subflows/logout.yaml
