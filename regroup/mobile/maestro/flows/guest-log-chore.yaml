# Flow 12 — Guest: open chore summary and complete a chore
# Persona: guest-a. Completing a chore writes an activity (CHORE) to Firestore.
# A photo-upload Alert may appear; the "skip" path is handled optionally.
# Verify persistence afterward with: node maestro/scripts/assert-firestore.js
# Run: maestro test -e APP_ID=com.rats.dev.e2e.emu maestro/flows/guest-log-chore.yaml
appId: ${APP_ID}
tags:
  - guest
  - activities
---
- runFlow: ../subflows/guard-e2e-app.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-guest-a@rats-e2e.com
      PASSWORD: ${E2E_TEST_PASSWORD}
- tapOn:
    id: "guest-tab"
- extendedWaitUntil:
    visible:
      id: "guest-overview-screen"
    timeout: 30000
- tapOn:
    id: "chores-card"
- extendedWaitUntil:
    visible:
      id: "chore-summary-screen"
    timeout: 30000
- assertVisible:
    id: "complete-chore-button"
- tapOn:
    id: "complete-chore-button"
# Photo prompt is a native Alert. Required: an optional tap here passed without
# logging the chore.
- extendedWaitUntil:
    visible:
      text: "Skip"
    timeout: 15000
- tapOn:
    text: "Skip"
- extendedWaitUntil:
    visible:
      text: "Chore marked as complete!"
    timeout: 30000
- tapOn:
    text: "OK"
# The server updates the weekly count after the write.
- extendedWaitUntil:
    visible:
      text: "[1-9][0-9]* of 1"
    timeout: 60000
- runFlow:
    file: ../subflows/logout.yaml
