# Reusable login subflow. Launches the app in emulator mode, walks the
# landing -> login -> authenticated path, and lands on house-tab.
#
# Parameterize the persona via env:
#   runFlow:
#     file: ../subflows/login.yaml
#     env:
#       EMAIL: test-manager@rats-e2e.com
#       PASSWORD: TestPassword123!
#
# Selector path ported from e2e/helpers/auth.js (Detox).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    arguments:
      IS_E2E_TEST: "1"
# Cold anonymous Firebase auth can take 10-15s on a simulator; give the
# landing screen room before interacting.
- extendedWaitUntil:
    visible:
      id: "initial-landing-screen"
    timeout: 30000
- tapOn:
    id: "sign-in-button"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 15000
# Use testID selectors — they map to accessibilityIdentifier on iOS and are
# reliable even inside KeyboardAwareScrollView. Text selectors hit the
# RatsLabel above the field, not the TextInput itself.
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
# Dismiss the keyboard so the layout settles before tapping the password field.
# Without this, the tap on password-input races the keyboard/scroll and fails to
# focus the field, so inputText lands nowhere and login submits empty.
- hideKeyboard
# Tap by testID — RatsTextInput forwards testID to the inner native TextInput
# (accessibilityIdentifier on iOS). Under E2E the field is non-secure
# (secureTextEntry gated on IS_E2E_TEST) so Maestro can type into it.
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- tapOn:
    id: "login-button"
# iOS may show a "Save Password?" Keychain sheet after credentials are submitted.
# Dismiss it so it doesn't block navigation to house-tab.
- tapOn:
    text: "Not Now"
    optional: true
# Login round-trip (auth + initial house data) can take up to a minute.
- extendedWaitUntil:
    visible:
      id: "house-tab"
    timeout: 60000
