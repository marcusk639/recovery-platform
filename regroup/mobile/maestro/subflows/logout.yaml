# Reusable logout subflow. Assumes an authenticated session (house-tab visible).
# Ends on the login screen, mirroring e2e/helpers/auth.js logout().
appId: ${APP_ID}
---
# The relaunch below starts the app, so refuse a non-e2e APP_ID first, as login.yaml does.
- runFlow: guard-e2e-app.yaml
# Flows can end anywhere, often on a sheet that covers the tab bar. Relaunch to reach it.
- stopApp
- launchApp:
    arguments:
      IS_E2E_TEST: "1"
- extendedWaitUntil:
    visible:
      id: "profile-tab"
    timeout: 30000
- tapOn:
    id: "profile-tab"
- assertVisible:
    id: "profile-screen"
- tapOn:
    id: "logout-button"
# The logout thunk navigates back to InitialLanding, not login-screen directly.
- extendedWaitUntil:
    visible:
      id: "initial-landing-screen"
    timeout: 10000
- tapOn:
    id: "sign-in-button"
- assertVisible:
    id: "login-screen"
