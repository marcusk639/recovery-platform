name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - dispute
          - verification
          - auth

jobs:
  e2e-ios:
    name: E2E Tests (iOS)
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Start Firebase Emulator
        run: |
          firebase emulators:start --only auth,firestore &
          echo "Waiting for emulators to start..."
          sleep 10

      - name: Build iOS app for Detox
        run: npm run test:e2e:build:ios

      - name: Run E2E tests
        run: |
          SUITE="${{ github.event.inputs.test_suite || 'all' }}"
          ./e2e/run-tests.sh --suite $SUITE --platform ios --no-build

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-artifacts-ios
          path: |
            e2e/artifacts/**/*
            e2e/*.log

      - name: Stop Firebase Emulator
        if: always()
        run: |
          pkill -f firebase || true

  e2e-android:
    name: E2E Tests (Android)
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: AVD cache
        uses: actions/cache@v3
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-cache

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Pixel_3a
          avd-name: Pixel_3a_API_30_x86
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Start Firebase Emulator
        run: |
          firebase emulators:start --only auth,firestore &
          echo "Waiting for emulators to start..."
          sleep 10

      - name: Build Android app for Detox
        run: npm run test:e2e:build:android

      - name: Run E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Pixel_3a
          avd-name: Pixel_3a_API_30_x86
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            SUITE="${{ github.event.inputs.test_suite || 'all' }}"
            ./e2e/run-tests.sh --suite $SUITE --platform android --no-build

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-artifacts-android
          path: |
            e2e/artifacts/**/*
            e2e/*.log

      - name: Stop Firebase Emulator
        if: always()
        run: |
          pkill -f firebase || true

  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [e2e-ios, e2e-android]
    if: always()

    steps:
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-artifacts-ios
          path: artifacts/ios

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-artifacts-android
          path: artifacts/android

      - name: Generate summary report
        run: |
          echo "# E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## iOS Tests" >> $GITHUB_STEP_SUMMARY

          if [ -d "artifacts/ios" ]; then
            echo "✅ iOS artifacts generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ iOS artifacts missing" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Android Tests" >> $GITHUB_STEP_SUMMARY

          if [ -d "artifacts/android" ]; then
            echo "✅ Android artifacts generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Android artifacts missing" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: artifacts/**/*
          retention-days: 30
