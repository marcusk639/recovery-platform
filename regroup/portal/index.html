<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regroup</title>
    <style>
      /* The phone bundles these fonts. Without aliases the browser falls back to serif. */
      @font-face {
        font-family: "Quicksand-Light";
        src: local("Helvetica Neue"), local("Segoe UI"), local("Arial");
      }
      @font-face {
        font-family: "Quicksand-Medium";
        src: local("Helvetica Neue"), local("Segoe UI"), local("Arial");
      }
      @font-face {
        font-family: "Quicksand-Bold";
        src: local("Helvetica Neue"), local("Segoe UI"), local("Arial");
      }
      /* Staff don't log or correct a resident's activities (spec, section 5). The
         phone shows staff these two buttons, and the rules would allow the write. */
      [data-testid="add-hours-button"],
      [data-testid="update-medication-button"] { display: none !important; }
      html, body, #root { height: 100%; margin: 0; }
      #root { display: flex; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
