<div class="contact-page">
    <div class="main">
        <app-scrollup></app-scrollup>
        <app-header-two></app-header-two>
        <app-breadcrumb-contact></app-breadcrumb-contact>
        <section id="contact" class="contact-area bg-gray ptb_100">
            <div class="container">
                <div class="row">
                    <div class="col-12 col-md-10 col-lg-8">
                        <!-- Section Heading -->
                        <div class="section-heading">
                            <span class="d-inline-block rounded-pill shadow-sm fw-5 px-4 py-2 mb-3">
                                <i class="far fa-lightbulb text-primary mr-1"></i>
                                <span class="text-primary">Stay</span>
                                Tuned
                            </span>
                            <h2>Don't hesitate to contact us</h2>
                            <p class="d-none d-sm-block mt-4">Contact us with any questions, feedback, or suggestions
                                you may
                                have.
                            </p>
                            <p class="d-block d-sm-none mt-4">Contact us with any questions, feedback, or suggestions
                                you may
                                have.</p>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-between">
                    <div class="col-12 col-md-5">
                        <!-- Contact Us -->
                        <div class="contact-us">
                            <!-- <p class="mb-3">Regroup LLC, 1507 Audubon
                                Parc Dr, Cary, NC 27518</p> -->
                            <ul>
                                <li class="py-2">
                                    <a class="media" href="#">
                                        <div class="social-icon mr-3">
                                            <i class="fas fa-phone-alt"></i>
                                        </div>
                                        <span class="media-body align-self-center">+1 (337) 802-7540</span>
                                    </a>
                                </li>
                                <li class="py-2">
                                    <a class="media" href="#">
                                        <div class="social-icon mr-3">
                                            <i class="fas fa-envelope"></i>
                                        </div>
                                        <span
                                            class="media-body align-self-center">admin@{{appName.toLowerCase()}}.com</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 pt-4 pt-md-0">
                        <!-- Contact Box -->
                        <div *ngIf="showMessage" class="alert alert-success" role="alert">
                            Message successfully sent!
                        </div>
                        <div class="contact-box text-center">
                            <!-- Contact Form -->
                            <form id="contact-form" [formGroup]="formGroup">
                                <div class="row">
                                    <div class="col-12">
                                        <!-- <div class="form-group">
                                    <input type="text" class="form-control" name="name" placeholder="Name"
                                        required="required">
                                </div>
                                <div class="form-group">
                                    <input type="email" class="form-control" name="email" placeholder="Email"
                                        required="required">
                                </div>
                                <div class="form-group">
                                    <input type="text" class="form-control" name="subject" placeholder="Subject"
                                        required="required">
                                </div> -->
                                        <mek-field [formGroup]="formGroup" formControlName="name" name="name"
                                            type="text" required="true" placeholder="Name">
                                        </mek-field>
                                        <mek-field [formGroup]="formGroup" formControlName="email" name="email"
                                            type="email" required="true" placeholder="Email"></mek-field>
                                        <mek-field [formGroup]="formGroup" formControlName="subject" name="subject"
                                            type="text" required="true" placeholder="Subject">
                                        </mek-field>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-group">
                                            <textarea class="form-control" formControlName="message" name="message"
                                                placeholder="Message" required="required"></textarea>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <button type="button" class="btn btn-lg btn-block mt-3" [disabled]="!valid"
                                            (click)="submit()"><span class="text-white pr-3"><i
                                                    class="fas fa-paper-plane"></i></span>Send
                                            Message</button>
                                    </div>
                                </div>
                            </form>
                            <p class="form-message"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- <section class="section map-area">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2485.596666220624!2d-0.16124461362595294!3d51.46556134684942!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x487605a25375dfb7%3A0xe0d9fa09dcf932a8!2s15%20Theatre%20St%2C%20Battersea%2C%20London%20SW11%205ND%2C%20UK!5e0!3m2!1sen!2sbd!4v1567427969685!5m2!1sen!2sbd"
                width="100" height="100" style="border:0;" allowfullscreen=""></iframe>
        </section> -->
        <app-footer-one></app-footer-one>
    </div>
</div>
