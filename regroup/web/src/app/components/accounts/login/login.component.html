<div class="homepage-5 accounts inner-pages">
  <div class="main">
    <app-header-two></app-header-two>
    <section id="home" class="section welcome-area bg-overlay d-flex align-items-center h-100vh">
      <div class="container">
        <div class="row align-items-center justify-content-center">
          <!-- Welcome Intro Start -->
          <div *ngIf="!isMobile" class="col-12 col-lg-7">
            <div class="welcome-intro">
              <h1 class="text-white">Welcome back!</h1>
              <p class="text-white my-4">Sign in and we'll get you started.</p>
            </div>
          </div>
          <div class="col-12 col-md-8 col-lg-5">
            <!-- Contact Box -->
            <div class="contact-box bg-white text-center rounded p-4 p-sm-5 mt-5 mt-lg-0 shadow-lg">
              <div *ngIf="loading">
                <span><i [class]="'fas fa-spinner fa-3x fa-spin'"></i></span>
              </div>
              <!-- Contact Form -->
              <form [formGroup]="formGroup" *ngIf="!loading" id="contact-form">
                <div class="contact-top">
                  <h3 class="contact-title">Sign In</h3>
                  <h5 class="text-secondary fw-3 py-3">Please enter your email and password so we can log you in.</h5>
                </div>
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <mek-field
                        [formGroup]="formGroup"
                        formControlName="email"
                        [iconStyle]="'fa-envelope-open'"
                        name="email"
                        type="email"
                        required="true"
                        placeholder="Email"
                      ></mek-field>
                    </div>
                    <div class="form-group">
                      <mek-field
                        [formGroup]="formGroup"
                        formControlName="password"
                        [iconStyle]="'fa-unlock-alt'"
                        name="password"
                        type="password"
                        required="true"
                        placeholder="Password"
                      ></mek-field>
                    </div>
                  </div>
                  <div *ngIf="error" class="col-12 text-danger">{{ error }}</div>
                  <div class="col-12">
                    <button [disabled]="!valid" class="btn btn-bordered w-100 mt-3" type="submit" (keyup.enter)="onSubmit()" (click)="onSubmit()">
                      Next
                    </button>
                  </div>
                  <div class="col-12">
                    <span class="d-block pt-2 mt-4 border-top">Don't have an account? <a [routerLink]="['/signup']">Sign Up</a></span>
                  </div>
                </div>
              </form>
              <p class="form-message"></p>
            </div>
          </div>
        </div>
      </div>
      <!-- Shape Bottom -->
      <div class="shape-bottom">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" preserveAspectRatio="none">
          <path
            class="shape-fill"
            fill="#FFFFFF"
            d="M421.9,6.5c22.6-2.5,51.5,0.4,75.5,5.3c23.6,4.9,70.9,23.5,100.5,35.7c75.8,32.2,133.7,44.5,192.6,49.7  c23.6,2.1,48.7,3.5,103.4-2.5c54.7-6,106.2-25.6,106.2-25.6V0H0v30.3c0,0,72,32.6,158.4,30.5c39.2-0.7,92.8-6.7,134-22.4  c21.2-8.1,52.2-18.2,79.7-24.2C399.3,7.9,411.6,7.5,421.9,6.5z"
          ></path>
        </svg>
      </div>
    </section>
  </div>
</div>
