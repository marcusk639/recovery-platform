<section id="contact" class="contact-area bg-gray ptb_100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-6">
                <!-- Section Heading -->
                <div class="section-heading text-center">
                    <h2 class="text-capitalize">Stay Tuned</h2>
                    <p class="d-none d-sm-block mt-4">Contact us with any questions, feedback, or suggestions you may
                        have.</p>
                    <p class="d-block d-sm-none mt-4">Contact us with any questions, feedback, or suggestions you may
                        have.</p>
                </div>
            </div>
        </div>
        <div class="row justify-content-between">
            <div class="col-12 col-md-5">
                <!-- Contact Us -->
                <div class="contact-us">
                    <!-- <p class="mb-3">Contrary to popular belief, Lorem Ipsum is not simply random text. It has roots in a
                        piece of classical Latin literature from 45 BC, making it over 2000 years old.</p> -->
                    <ul>
                        <li class="py-2">
                            <a class="media" href="#">
                                <div class="social-icon mr-3">
                                    <i class="fas fa-phone-alt"></i>
                                </div>
                                <span class="media-body align-self-center">+1 (337) 802-7540</span>
                            </a>
                        </li>
                        <li class="py-2">
                            <a class="media" href="#">
                                <div class="social-icon mr-3">
                                    <i class="fas fa-envelope"></i>
                                </div>
                                <span class="media-body align-self-center">admin@regroup-app.com</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-12 col-md-6 pt-4 pt-md-0">
                <!-- Contact Box -->
                <div *ngIf="showMessage" class="alert alert-success" role="alert">
                    Message successfully sent!
                </div>
                <div class="contact-box text-center">
                    <!-- Contact Form -->
                    <form id="contact-form" [formGroup]="formGroup">
                        <div class="row">
                            <div class="col-12">
                                <!-- <div class="form-group">
                                    <input type="text" class="form-control" name="name" placeholder="Name"
                                        required="required">
                                </div>
                                <div class="form-group">
                                    <input type="email" class="form-control" name="email" placeholder="Email"
                                        required="required">
                                </div>
                                <div class="form-group">
                                    <input type="text" class="form-control" name="subject" placeholder="Subject"
                                        required="required">
                                </div> -->
                                <mek-field [formGroup]="formGroup" formControlName="name" name="name" type="text"
                                    required="true" placeholder="Name">
                                </mek-field>
                                <mek-field [formGroup]="formGroup" formControlName="email" name="email" type="email"
                                    required="true" placeholder="Email"></mek-field>
                                <mek-field [formGroup]="formGroup" formControlName="subject" name="subject" type="text"
                                    required="true" placeholder="Subject">
                                </mek-field>
                            </div>
                            <div class="col-12">
                                <div class="form-group">
                                    <textarea class="form-control" formControlName="message" name="message"
                                        placeholder="Message" required="required"></textarea>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="button" class="btn btn-lg btn-block mt-3" [disabled]="!valid"
                                    (click)="submit()"><span class="text-white pr-3"><i
                                            class="fas fa-paper-plane"></i></span>Send
                                    Message</button>
                            </div>
                        </div>
                    </form>
                    <p class="form-message"></p>
                </div>
            </div>
        </div>
    </div>
</section>
