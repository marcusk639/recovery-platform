# Flow: New user completes signup via AuthModal (Signup tab, the default), reaching
# group-list-screen on success.
# Run: maestro test homegroups/mobile/maestro/flows/registration-signup.yaml
#
# CORRECTED: the original version of this file targeted LandingScreen/RegisterScreen via
# AuthNavigator, which AppNavigator.tsx never mounts (same dead-code trap subflows/login.yaml
# had — see that file's header comment for the full traced path). AuthModal's Signup tab is
# the default tab (no tab-switch needed here, unlike login's flow which must switch away from
# it). On success, handleSignup calls onAuthSuccess() directly (AuthModal.tsx:146-172) — same
# mechanism as login — landing on group-list-screen via the Home tab. setActiveTab('login') in
# AuthModal only fires on an "email-already-in-use" ERROR, not on success.
appId: org.recoveryconnect
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Skip"
    timeout: 30000
- tapOn: "Skip"
# RN flattens LimitedModeScreen into one merged accessibility blob, so the CTAs are NOT
# matchable by visible text — tap the testID instead (validated by smoke-app-boot.yaml).
# Both "Create Account" and "Sign in" open the same AuthModal (default Signup tab).
- extendedWaitUntil:
    visible:
      id: "limited-mode-create-account-button"
    timeout: 20000
- tapOn:
    id: "limited-mode-create-account-button"
# AuthModal opens on the Signup tab by default — no tab switch needed.
- extendedWaitUntil:
    visible:
      id: "auth-modal-name-input"
    timeout: 10000
- tapOn:
    id: "auth-modal-name-input"
- inputText: "E2E Tester"
- hideKeyboard
- tapOn:
    id: "auth-modal-email-input"
# NEEDS LIVE VERIFICATION: Firebase will reject a duplicate email on repeat runs — this
# static address collides after the first successful run. Pass a unique EMAIL via
# `maestro test --env EMAIL=e2e-signup-$(date +%s)@homegroups-e2e.com ...` or add a
# Firebase Auth cleanup step before this flow runs in CI.
- inputText: "e2e-signup-000@homegroups-e2e.com"
- hideKeyboard
- tapOn:
    id: "auth-modal-password-input"
- inputText: "TestPassword123!"
- hideKeyboard
- tapOn:
    id: "auth-modal-confirm-password-input"
- inputText: "TestPassword123!"
- hideKeyboard
- tapOn:
    id: "auth-modal-signup-button"
- extendedWaitUntil:
    visible:
      id: "group-list-screen"
    timeout: 30000
