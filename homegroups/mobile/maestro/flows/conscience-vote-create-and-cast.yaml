appId: org.recoveryconnect
---
# Flow: Admin creates a new group-conscience vote and casts a vote on it.
# Navigation base proven in e2e/screens/homegroup/group-conscience.spec.js
# ("group-overview-conscience-tile" -> "Group Conscience" -> "new-vote-button").
# Run: maestro test homegroups/mobile/maestro/flows/conscience-vote-create-and-cast.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-admin@homegroups-e2e.com
      PASSWORD: TestPassword123!
# login subflow already lands on the Home tab / group-list-screen; the bottom-tab label is
# not a matchable "Home" text node on iOS, so this tab tap is optional (belt-and-suspenders).
- tapOn:
    text: "Home"
    optional: true
- extendedWaitUntil:
    visible:
      id: "group-list-screen"
    timeout: 15000
# CORRECTED 2026-07-17: was `id: "group-list"` — that testID is on the FlatList CONTAINER
# (GroupListScreen.tsx:292), not a row. Tapping it hits the container bounding-box center,
# which for a single-seeded-group account lands in empty space below the one card and selects
# nothing (next wait for group-info-section then times out). Target an actual group row; real
# per-card testID is `group-card-${item.id}` (GroupListScreen.tsx:134).
# NEEDS-LIVE-RUN: confirm the installed Maestro CLI supports regex `id` matching (same open
# question already flagged for `meeting-item-.*` in qr-meeting-checkin.yaml).
- tapOn:
    id: "group-card-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "group-info-section"
    timeout: 15000
# The conscience tile sits below the fold (under Admin Actions + Members/Announcements
# tiles), so scroll it into view before tapping — tapOn alone does not auto-scroll.
- scrollUntilVisible:
    element:
      id: "group-overview-conscience-tile"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "group-overview-conscience-tile"
- extendedWaitUntil:
    visible:
      text: "Group Conscience"
    timeout: 15000
# new-vote-button ("Start New Vote") sits below the Active Votes list; with existing votes it
# can be below the fold, so scroll to it.
- scrollUntilVisible:
    element:
      id: "new-vote-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "new-vote-button"
- extendedWaitUntil:
    visible:
      id: "create-conscience-vote-screen"
    timeout: 15000
- tapOn:
    id: "vote-title-input"
- inputText: "E2E Test Motion - Change meeting day?"
# hideKeyboard removed — flaky on iOS sims. Tapping the next field moves focus; Maestro
# scrolls to reveal the submit button if the keyboard overlaps it.
- tapOn:
    id: "vote-description-input"
- inputText: "Automated Maestro flow - safe to ignore/close."
# The multiline description leaves the keyboard up covering the submit button. This screen's
# ScrollView uses keyboardShouldPersistTaps="handled" (CreateConscienceVoteScreen.tsx:114), so
# tapping the static "Vote Options" header dismisses the keyboard (hideKeyboard is flaky on iOS).
- tapOn: "Vote Options"
# Vote options default to ["Yes", "No", "Abstain"] — leaving them unedited is intentional.
# Submit button sits below the options/quorum fields — scroll to it.
- scrollUntilVisible:
    element:
      id: "create-vote-submit-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "create-vote-submit-button"
# CreateConscienceVoteScreen.tsx:86-95 shows a blocking native
# Alert.alert('Vote Created', ..., [{text: 'OK', onPress: () => navigation.goBack()}]) —
# navigation.goBack() only fires once "OK" is tapped. optional:true since native alert
# button-matching can be platform-variable (matches this plan's established pattern elsewhere).
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Group Conscience"
    timeout: 15000
# GroupConscienceScreen.tsx has no focus-listener/useFocusEffect — only a mount-time
# useEffect that fetches votes once (confirmed by source read). The screen instance we
# land back on via navigation.goBack() is the same stale mount, so it won't include the
# vote just created. Pull-to-refresh forces a refetch. Do NOT remove this step to "clean
# up" the flow — it is covering a real app-code gap, not a flow-authoring choice.
- swipe:
    direction: DOWN
    duration: 500
# Cast a vote on the "Yes" option. Real testID is `option-${vote.id}-${option}` — vote.id
# is an unknown Firestore doc ID at authoring time. NEEDS LIVE VERIFICATION: if the group
# already has another open vote with a "Yes" option, this text match is ambiguous;
# index:0 assumes newest-first ordering, typical but not confirmed from source alone.
- assertVisible: "E2E Test Motion - Change meeting day?"
- tapOn:
    text: "Yes"
    index: 0
# Casting is an async callable round-trip; wait for the post-vote confirmation to render.
# GroupConscienceScreen.tsx:224 renders "Your vote: <opt> (tap another option to change)" once
# myVote is set — RN merges the split Text nodes, so match the distinctive trailing parenthetical
# ("another option to change") which only appears AFTER a vote is cast, rather than "Your vote:".
- extendedWaitUntil:
    visible:
      text: ".*another option to change.*"
    timeout: 15000
- runFlow:
    file: ../subflows/logout.yaml
