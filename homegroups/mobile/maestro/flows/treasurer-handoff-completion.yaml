appId: org.recoveryconnect
---
# Flow: Treasurer initiates a role handoff to another member, through both native confirm
# alerts. Full "completion" (new treasurer accepting, then the original treasurer
# confirming via HandoffConfirmationScreen — which has NO testIDs at all) is a two-account,
# multi-session flow that cannot be exercised end-to-end from a single Maestro run; this
# flow covers everything a single session can prove.
# Navigation base proven in e2e/screens/homegroup/treasury-handoff.spec.js.
# Run: maestro test homegroups/mobile/maestro/flows/treasurer-handoff-completion.yaml
#
# Requires the logged-in account to hold the Treasurer role in the target group
# (InitiateHandoffScreen gates the initiate button on this; treasury-handoff.spec.js
# itself "skips gracefully" if the test account isn't treasurer — same caveat applies here.
# NEEDS LIVE VERIFICATION: seed the test-treasurer persona, see maestro/README.md).
#
# ADDITIONAL GATE: GroupOverviewScreen.tsx:283-289's navigateToGroupTreasury() redirects to
# SubscriptionUpgrade instead of the treasury screen when the current user is BOTH a group
# admin AND the group lacks an active subscription/trial. This is separate from (and earlier
# than) the treasurer-role gate above. The test-treasurer persona must NOT also be a group
# admin on a non-subscribed/non-trial group, or this flow will be redirected to
# SubscriptionUpgrade instead of reaching treasury-summary-section.
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: test-treasurer@homegroups-e2e.com
      PASSWORD: TestPassword123!
# bottom-tab label not matchable on iOS; login already lands on Home/group-list.
- tapOn:
    text: "Home"
    optional: true
- extendedWaitUntil:
    visible:
      id: "group-list-screen"
    timeout: 15000
# CORRECTED 2026-07-17: was `id: "group-list"` — that testID is on the FlatList CONTAINER
# (GroupListScreen.tsx:292), not a row. Tapping it hits the container bounding-box center,
# which for a single-seeded-group account lands in empty space below the one card and selects
# nothing (next wait for group-info-section then times out). Target an actual group row; real
# per-card testID is `group-card-${item.id}` (GroupListScreen.tsx:134).
# NEEDS-LIVE-RUN: confirm the installed Maestro CLI supports regex `id` matching (same open
# question already flagged for `meeting-item-.*` in qr-meeting-checkin.yaml).
- tapOn:
    id: "group-card-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "group-info-section"
    timeout: 15000
# treasury tile is below the fold on the group overview — scroll to it.
- scrollUntilVisible:
    element:
      id: "group-overview-treasury-tile"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "group-overview-treasury-tile"
- extendedWaitUntil:
    visible:
      id: "treasury-summary-section"
    timeout: 15000
- assertVisible:
    id: "treasury-initiate-handoff-button"
- tapOn:
    id: "treasury-initiate-handoff-button"
- extendedWaitUntil:
    visible:
      text: "Transfer Treasurer Role"
    timeout: 15000
- assertVisible:
    id: "handoff-member-list"
# InitiateHandoffScreen.tsx:221's handoff-member-list is a single, un-repeated container
# View wrapping multiple untagged member rows — not a FlatList with per-item testIDs. This
# is NOT indexed-row-selection: Maestro resolves the one testID match by tapping the center
# of its bounding box, landing on whichever row sits at the visual midpoint (not "row 0").
# Likely harmless since the flow doesn't care which member is picked, but a future
# improvement would be adding per-row testIDs (e.g. handoff-member-{userId}) to
# InitiateHandoffScreen.tsx for intentional selection. NEEDS LIVE VERIFICATION: confirm the
# group has at least one other member eligible for handoff (i.e. the container isn't
# showing only the empty state).
- tapOn:
    id: "handoff-member-list"
    index: 0
# Bottom action button (text "Initiate Handoff") triggers
# Alert.alert('Confirm Handoff', ..., [Cancel, {text:'Initiate Handoff'}]). The two taps
# below hit the screen button then the alert's confirm button, which share the same text.
- tapOn: "Initiate Handoff"
- tapOn:
    text: "Initiate Handoff"
    optional: true
# Success Alert.alert('Handoff Initiated', ...) with a single "OK" button, then
# navigation.goBack() returns to Treasury.
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      id: "treasury-summary-section"
    timeout: 15000
- runFlow:
    file: ../subflows/logout.yaml
