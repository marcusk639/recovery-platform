# Reusable login subflow. Walks fresh launch -> Onboarding welcome (skip) -> Main limited-mode
# Home tab -> AuthModal (Login tab) -> authenticated GroupStackNavigator.
#
# CORRECTED 2026-07-10: the original version of this file targeted LandingScreen/LoginScreen
# via AuthNavigator, which AppNavigator.tsx never mounts (dead code — confirmed by reading
# AppNavigator.tsx, which only ever renders Onboarding or Main). The real, live auth UI is
# AuthModal.tsx, reached via MainTabNavigator's limited-mode "Sign in" trigger. See
# OnboardingScreen.tsx (skipOnboarding), MainTabNavigator.tsx (showAuthPrompt, AuthModal
# render), and AuthModal.tsx (login tab fields) for the full traced path.
#
# Parameterize the persona via env:
#   - runFlow:
#       file: ../subflows/login.yaml
#       env:
#         EMAIL: test-admin@homegroups-e2e.com
#         PASSWORD: TestPassword123!
appId: org.recoveryconnect
---
- launchApp:
    clearState: true
# First launch after a fresh install shows the iOS notification-permission dialog over
# onboarding. clearState does not clear the system permission record, so it only appears
# once per install — dismiss it optionally so the flow is robust either way.
- tapOn:
    text: "Allow"
    optional: true
# Onboarding may or may not appear: a fresh/logged-out launch shows the welcome carousel (tap
# "Skip"), but a returning user whose onboardingComplete is persisted goes STRAIGHT to the home —
# no Skip button. Let the screen settle, then dismiss onboarding (and the notification dialog) IF
# present, tapping "Skip" until it's gone. Robust to both cases.
- waitForAnimationToEnd:
    timeout: 6000
- tapOn:
    text: "Allow"
    optional: true
- repeat:
    while:
      visible:
        text: "Skip"
    times: 5
    commands:
      - tapOn:
          text: "Skip"
          optional: true
# IDEMPOTENT: Firebase Auth persists its token in the iOS Keychain, which clearState (and even
# app reinstall) does NOT clear — only a full `simctl erase` or in-app signOut does. So after
# Skip the app may ALREADY be authenticated (persisted session) and land on group-list-screen,
# OR be logged out and show LimitedModeScreen. Only perform the login when the limited-mode CTA
# is present. (RN flattens LimitedModeScreen into one accessibility blob, so its CTAs are only
# matchable by testID, added 2026-07-17.) Let the post-skip screen settle before branching.
- waitForAnimationToEnd:
    timeout: 6000
- runFlow:
    when:
      visible:
        id: "limited-mode-create-account-button"
    commands:
      - tapOn:
          id: "limited-mode-create-account-button"
      # AuthModal opens defaulting to the Signup tab — switch to Login.
      - extendedWaitUntil:
          visible:
            text: "Login"
          timeout: 10000
      - tapOn: "Login"
      # No hideKeyboard: AuthModal uses KeyboardAvoidingView (behavior="padding",
      # AuthModal.tsx:362), so fields + Sign In button stay above the keyboard.
      - tapOn:
          id: "auth-modal-login-email-input"
      - inputText: ${EMAIL}
      - tapOn:
          id: "auth-modal-login-password-input"
      - inputText: ${PASSWORD}
      - tapOn:
          id: "auth-modal-login-button"
# On success (or if already authenticated), the Home tab renders GroupStackNavigator. On the
# full-login path iOS pops a "Save Password?" system dialog at unpredictable timing that covers
# group-list-screen. Poll until the group list is up, dismissing "Not Now" each iteration — the
# loop exits as soon as group-list-screen appears (on the already-authenticated Keychain path it
# is visible immediately, so this no-ops). This is more reliable than a single timed dismissal,
# and keeps the fix E2E-only (avoids a prod UX regression from disabling password autofill).
- repeat:
    while:
      notVisible:
        id: "group-list-screen"
    times: 20
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
# The login ALWAYS persists the session to the iOS Keychain, but the immediate UI transition to
# the group list can lag behind the Save-Password dialog (occasionally past the poll above). If
# we're still not on the group list, relaunch WITHOUT clearing state — Keychain auth survives, so
# the app boots straight through onboarding to the authenticated home. This makes the full-login
# path reliable within a single run (the flaky part is only the first-transition UI, never auth).
- runFlow:
    when:
      notVisible:
        id: "group-list-screen"
    commands:
      # clearState:true keeps Keychain auth (Firebase auth lives in the Keychain, NOT app data)
      # AND resets navigation to the default Home tab — clearState:false would restore a persisted
      # non-Home tab (e.g. Meetings) and group-list-screen would not be visible.
      - launchApp:
          clearState: true
      - tapOn:
          text: "Skip"
          optional: true
# An authenticated session can land on a non-Home tab (e.g. Meetings), where group-list-screen
# is not present — tap the Home tab (tab-home testID) to be sure we're on it.
- tapOn:
    id: "tab-home"
    optional: true
- extendedWaitUntil:
    visible:
      id: "group-list-screen"
    timeout: 30000
