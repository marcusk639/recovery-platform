# Reusable login subflow. Walks fresh launch -> Onboarding welcome (skip) -> Main limited-mode
# Home tab -> AuthModal (Login tab) -> authenticated GroupStackNavigator.
#
# CORRECTED 2026-07-10: the original version of this file targeted LandingScreen/LoginScreen
# via AuthNavigator, which AppNavigator.tsx never mounts (dead code — confirmed by reading
# AppNavigator.tsx, which only ever renders Onboarding or Main). The real, live auth UI is
# AuthModal.tsx, reached via MainTabNavigator's limited-mode "Sign in" trigger. See
# OnboardingScreen.tsx (skipOnboarding), MainTabNavigator.tsx (showAuthPrompt, AuthModal
# render), and AuthModal.tsx (login tab fields) for the full traced path.
#
# Parameterize the persona via env:
#   - runFlow:
#       file: ../subflows/login.yaml
#       env:
#         EMAIL: test-admin@homegroups-e2e.com
#         PASSWORD: TestPassword123!
appId: org.recoveryconnect
---
- launchApp:
    clearState: true
# Onboarding welcome step — Skip button has no testID, text-only selector.
- extendedWaitUntil:
    visible:
      text: "Skip"
    timeout: 30000
- tapOn: "Skip"
# Lands in Main, limited mode, Home tab (LimitedHomeScreen). Neither CTA has a testID —
# "Create Account" and "Sign in" both open the same AuthModal instance.
- extendedWaitUntil:
    visible:
      text: "Sign in"
    timeout: 20000
- tapOn: "Sign in"
# AuthModal opens defaulting to the Signup tab — switch to Login.
- extendedWaitUntil:
    visible:
      text: "Login"
    timeout: 10000
- tapOn: "Login"
- tapOn:
    id: "auth-modal-login-email-input"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    id: "auth-modal-login-password-input"
- inputText: ${PASSWORD}
- tapOn:
    id: "auth-modal-login-button"
# On success, isAuthenticated flips true and the Home tab re-renders as GroupStackNavigator.
- extendedWaitUntil:
    visible:
      id: "group-list-screen"
    timeout: 60000
