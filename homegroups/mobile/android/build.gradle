buildscript {
    ext {
        // 2.1.20, as in regroup/mobile (its build.gradle has the full history):
        // @stripe/stripe-react-native 0.44.0's native SDK depends on
        // kotlin-stdlib 2.1.10, whose metadata a 1.9 compiler can't read
        // (":stripe_stripe-react-native:compileDebugKotlin ... binary version of
        // its metadata is 2.1.0, expected version is 1.9"). Raising the compiler
        // is the fix regroup's CI confirmed; forcing the stdlib down was disproved.
        kotlinVersion = "2.1.20"
        // Pinned native Stripe SDK for wrapper 0.44.0, the version regroup/mobile
        // confirmed by bisecting real AARs: 21.18.0+ breaks the wrapper's compile
        // (Typography opt-in), 21.24.0+ again (DisplayPayNowDetails). The wrapper
        // reads rootProject.ext.stripeVersion ahead of its own 21.10.+ range.
        stripeVersion = "21.14.0"
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34 // Keep compileSdk at 34
        targetSdkVersion = 34
        composeVersion = "1.5.8" // Keep for composeOptions reference, though compose feature is disabled
        androidXCore = "1.12.0"
        androidXAppCompat = "1.6.1"
        androidXActivity = "1.8.0"
        androidXFragment = "1.6.1"
        // 8.1.1 is the floor demanded by the transitive androidx artifacts:
        // :app:checkDebugAarMetadata failed with
        // androidx.navigation:navigation-runtime-android:2.9.7 requiring
        // "Android Gradle plugin 8.1.1 or higher". AGP 8.1.x needs Gradle 8.0+
        // (wrapper) and JDK 17 (CI uses 17; a local build needs JAVA_HOME on a
        // 17 install). Kept equal to regroup/mobile on purpose.
        agpVersion = "8.1.1"

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Use the ext property for AGP version
        classpath("com.android.tools.build:gradle:$agpVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
        // Use the ext property for Kotlin version
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        // Remove Kotlin Serialization unless explicitly needed
        // classpath("org.jetbrains.kotlin:kotlin-serialization:$kotlinVersion")
        // Remove JetBrains Compose plugin classpath
    }
}

// Remove the top-level plugins block entirely

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // androidx.core is a transitive dependency that floats. 1.15.0+ requires
    // compileSdk 35 and 1.16.0 also requires AGP 8.6.0 (read from each AAR's
    // aar-metadata.properties). 1.13.1 is the newest release that builds with
    // compileSdk 34 on AGP 8.1.1. Pinned here rather than raising AGP, which would
    // also need a newer Gradle and move regroup/mobile too.
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    doNotTrackState("Kotlin compilation is not tracked")
}

// Same bridges as regroup/mobile/android/build.gradle (see the comments there for
// the failures each one answers). AGP 8 requires them across every module.
subprojects { project ->
    // Java level of every Android module, in AGP's finalizeDsl (after the
    // module's own build script, before AGP locks the DSL). React Native 0.72
    // forced 11 everywhere; gradle.properties turns that off
    // (react.internal.disableJavaVersionAlignment) because it overrode 17 for
    // @react-native-firebase v21+, whose Java source needs 16+ (pattern
    // matching in instanceof) though its build file asks for 11 (issue #87).
    // Same 11 as before for every other module; 17 for react-native-firebase.
    // Writing compileOptions in afterEvaluate is too late (discarded), and
    // setting the JavaCompile tasks is overwritten by AGP. The Kotlin jvmTarget
    // bridge below reads targetCompatibility, so Kotlin follows.
    def javaLevel = { ->
        def level = project.name.startsWith('react-native-firebase')
            ? JavaVersion.VERSION_17 : JavaVersion.VERSION_11
        project.extensions.getByName('androidComponents').finalizeDsl { ext ->
            ext.compileOptions.sourceCompatibility = level
            ext.compileOptions.targetCompatibility = level
        }
    }
    project.plugins.withId('com.android.application') { javaLevel() }
    project.plugins.withId('com.android.library') { javaLevel() }

    project.afterEvaluate {
        def android = project.extensions.findByName('android')
        if (android == null) {
            return
        }

        // AGP 8 stops generating BuildConfig unless each module opts in.
        if (android.buildFeatures.buildConfig == null) {
            android.buildFeatures.buildConfig = true
        }

        // Make Kotlin's jvmTarget follow each module's own Java target. Read
        // through a provider: :app's compileOptions are finalized after this block.
        project.tasks
            .withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile)
            .configureEach {
                compilerOptions.jvmTarget.set(project.provider {
                    // Static fromTarget, as in regroup/mobile on the same KGP 2.1.20.
                    // Under KGP 1.9.22 it was only an instance method on the companion
                    // and needed `JvmTarget.@Companion.fromTarget`; go back to that
                    // form if kotlinVersion ever drops below 2.x.
                    org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
                        android.compileOptions.targetCompatibility.toString())
                })
            }

        // AGP 8 requires a namespace and ignores the manifest `package`; derive it
        // for third-party modules that still only declare the latter.
        if (android.namespace == null) {
            def manifest = project.file('src/main/AndroidManifest.xml')
            if (manifest.exists()) {
                def declaredPackage = new groovy.xml.XmlSlurper(false, false)
                    .parse(manifest).@package.text()
                if (declaredPackage) {
                    android.namespace = declaredPackage
                    project.logger.lifecycle(
                        "AGP8 bridge: set namespace '${declaredPackage}' for :${project.name}")
                }
            }
        }
    }
}
