# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# https://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/refactor
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Gradle 7.6 needs a JDK 17 home. Don't hardcode a machine-specific path here — it breaks
# every other machine and CI. Set org.gradle.java.home in a local, gitignored
# gradle.properties override (or via JAVA_HOME) if your default JDK isn't 17.

# Version of flipper SDK to use with React Native
FLIPPER_VERSION=0.182.0

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

android.suppressUnsupportedCompileSdk=35

# Release signing config (MYAPP_RELEASE_STORE_FILE/KEY_ALIAS/STORE_PASSWORD/KEY_PASSWORD)
# is intentionally NOT defined here. build.gradle falls back to debug signing when these
# properties are absent. Real values (once a release keystore exists) do NOT belong in
# this file. The only mechanism that actually works today without further build.gradle
# changes is ORG_GRADLE_PROJECT_<name> environment variables (or an equivalent CI secret
# injection) — Gradle exposes those directly as project properties. NOTE:
# android/local.properties is gitignored, but nothing in build.gradle loads its keys as
# project properties (the Android Gradle Plugin only reads it for sdk.dir/ndk.dir), so
# putting these values there has no effect — same problem as the reserved-but-unwired
# `android/keystore.properties` path (gitignored, see .gitignore): a Properties-file load
# would need to be added to build.gradle before either path does anything.
