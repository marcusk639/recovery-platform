name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Agent-authored e2e-fix/* PRs must not reach the secret-bearing steps below.
      # Review events carry the head ref in the payload; issue_comment needs a lookup;
      # plain issues have no PR, so nothing to skip.
      - name: Skip e2e-fix branches
        id: pr-head
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          head_ref=""
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # Any lookup failure exits non-zero (bash -e), failing the step and
            # skipping every later step: fail-closed.
            pr_url=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.pull_request.url // empty')
            if [ -n "$pr_url" ]; then
              head_ref=$(gh api "repos/${REPO}/pulls/${ISSUE_NUMBER}" --jq '.head.ref')
            fi
          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            head_ref="$REVIEW_HEAD_REF"
          elif [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            head_ref="$REVIEW_HEAD_REF"
          fi
          case "$head_ref" in
            e2e-fix/*) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout repository
        if: steps.pr-head.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Node 22 matches ci.yml, for .github/scripts/claude-verify.sh.
      - name: Set up Node
        if: steps.pr-head.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Claude Code
        if: steps.pr-head.outputs.skip != 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # A package's verify (install, typecheck, full test suite) outlasts
          # Claude Code's 2-minute default Bash timeout and can near the
          # 10-minute cap on a cold install. The action writes this to
          # ~/.claude/settings.json, which the run loads.
          settings: |
            {"env": {"BASH_DEFAULT_TIMEOUT_MS": "1200000", "BASH_MAX_TIMEOUT_MS": "1800000"}}

          # Tag mode already allows git add/commit/rm and the action's push script.
          # These add read-only PR context and per-package verification, so a
          # commit is checked the way CI checks it before it is pushed.
          # Permission rules match the command text, not what it runs, so each
          # spelling of the verify command is listed; a cd/&& prefix still
          # misses, hence the exact form in the prompt. npm/npx stay off the
          # list on purpose: claude-verify.sh unsets the GitHub token before it
          # runs any PR code, and a direct npm ci or npm test would not.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(bash .github/scripts/claude-verify.sh:*),Bash(bash ./.github/scripts/claude-verify.sh:*),Bash(.github/scripts/claude-verify.sh:*),Bash(./.github/scripts/claude-verify.sh:*),Bash(bash ${{ github.workspace }}/.github/scripts/claude-verify.sh:*),Bash(${{ github.workspace }}/.github/scripts/claude-verify.sh:*)"
            --append-system-prompt "Before every commit to a pull request: (1) run gh pr view and gh pr diff on the PR to see its current state and changes; (2) for every package your change touches, run bash .github/scripts/claude-verify.sh followed by the package path (run it without arguments to list the packages). Run it from the repository root as one command, exactly 'bash .github/scripts/claude-verify.sh <package>', with no cd, && or ; before it (piping its output to tail is fine). It installs dependencies itself and runs typecheck and tests the way CI does; npm, npx and jest cannot be run directly here, by design, so do not try them. It can take several minutes: let it finish. If that exact command is refused, say so in your reply and quote the command; do not commit unverified changes. If verification fails, do not commit; fix the cause and run it again, or reply explaining the failure. Never weaken, skip or delete a test to make it pass. Say in your reply which packages you verified."

