name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-api:
    name: recovery-api — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: recovery-api/package-lock.json
      - name: Install dependencies
        run: cd recovery-api && npm ci
      - name: Typecheck
        run: cd recovery-api && npx tsc --noEmit
      - name: Test
        run: cd recovery-api && npm test -- --forceExit

  homegroups-functions:
    name: homegroups/functions — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/functions/package-lock.json
      - name: Install dependencies
        run: cd homegroups/functions && npm ci
      - name: Typecheck
        run: cd homegroups/functions && npx tsc --noEmit
      - name: Test
        run: cd homegroups/functions && npm test -- --forceExit

  homegroups-firestore-rules:
    name: homegroups/functions — Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install dependencies
        run: cd homegroups/functions && npm ci
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Run Firestore rules tests
        run: cd homegroups/functions && npm run test:rules

  homegroups-storage-rules:
    name: homegroups/functions — Storage security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install dependencies
        run: cd homegroups/functions && npm ci
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Run Storage rules tests
        run: cd homegroups/functions && npm run test:rules:storage

  homegroups-mobile:
    name: homegroups/mobile — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/mobile/package-lock.json
      - name: Install dependencies
        run: cd homegroups/mobile && npm ci
      - name: Test
        run: cd homegroups/mobile && npm test -- --ci

  homegroups-web:
    name: homegroups/web — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/web/package-lock.json
      - name: Install dependencies
        run: cd homegroups/web && npm ci
      - name: Test
        run: cd homegroups/web && CI=true npm test -- --watchAll=false

  regroup-functions:
    name: regroup/functions — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/functions/package-lock.json
      - name: Install dependencies
        run: cd regroup/functions && npm ci
      - name: Typecheck
        run: cd regroup/functions && npx tsc --noEmit
      - name: Test
        run: cd regroup/functions && npm test -- --forceExit

  regroup-e2e:
    name: regroup/e2e — jest
    runs-on: ubuntu-latest
    # hashFiles() is unavailable in job-level `if:`, so each step is guarded and the
    # job is a no-op until the regroup/e2e package exists on this branch.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: hashFiles('regroup/e2e/package.json') != ''
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/e2e/package-lock.json
      - name: Install dependencies
        if: hashFiles('regroup/e2e/package.json') != ''
        run: cd regroup/e2e && npm ci
      - name: Test
        if: hashFiles('regroup/e2e/package.json') != ''
        run: cd regroup/e2e && npx jest

  regroup-mobile:
    name: regroup/mobile — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/mobile/package-lock.json
      # `npm ci` alone cannot work here. Unlike homegroups/mobile, whose
      # postinstall guards CocoaPods behind `if [ "$(uname)" = "Darwin" ]`,
      # this package runs `pod-install` unconditionally, which fails on Linux.
      # Skipping lifecycle scripts also skips patch-package, and two patches
      # under regroup/mobile/patches are load-bearing, so run it explicitly.
      - name: Install dependencies
        run: cd regroup/mobile && npm ci --ignore-scripts && npx patch-package
      # Ratchet, not a clean-run gate. This package had no typecheck step at all,
      # so it starts from a large pre-existing set of errors, listed one per line
      # in regroup/mobile/.typecheck-baseline; the step fails only when an error
      # appears that is not in that list. If this run's errors differ from the
      # baseline purely because CI resolves dependencies differently from a
      # developer machine, regenerate the baseline from a CI run rather than
      # loosening the gate.
      - name: Typecheck (ratchet)
        run: cd regroup/mobile && npm run typecheck:ratchet
      - name: Test
        run: cd regroup/mobile && npm test -- --ci

  regroup-web:
    name: regroup/web — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/web/package-lock.json
      - name: Install dependencies
        run: cd regroup/web && npm ci
      # Deliberately not `npm test`: karma.conf.js exists and specs run locally
      # (`npm test -- --watch=false --browsers=ChromeHeadless`), but CI only
      # typechecks them. The full suite is not green yet (one known failing
      # CloudFunctionService spec, and the run aborts on an unhandled
      # rejection), so this job is named "typecheck", not "test", and does not
      # imply coverage it has not got.
      - name: Typecheck
        run: cd regroup/web && npx tsc --noEmit -p tsconfig.spec.json

  detox-recovery:
    name: detox-recovery — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: detox-recovery/package-lock.json
      - name: Install dependencies
        run: cd detox-recovery && npm ci
      - name: Typecheck
        run: cd detox-recovery && npx tsc --noEmit
      - name: Test
        run: cd detox-recovery && npm test -- --forceExit

  pr-review-checks:
    name: pr-review — checks tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node --test ".claude/pr-review/checks/test/*.test.mjs"

  maestro-smoke:
    name: Maestro Cloud — smoke tests (regroup Android)
    needs: [recovery-api, homegroups-functions, regroup-functions, detox-recovery]
    runs-on: ubuntu-latest
    # Only run on PRs — the `secrets` context isn't available in job-level `if:`
    # (only github/inputs/needs/vars are), so the actual Maestro-credit-saving
    # check happens on the Maestro step itself, below.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'e2e-fix/')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install regroup/mobile dependencies
        run: cd regroup/mobile && npm ci

      # Diagnostic, kept permanently rather than as a one-off: the Android build has
      # died from an OutOfMemoryError on this job before, and that is only diagnosable
      # against the runner's actual RAM/CPU, not assumed from GitHub's documented
      # ubuntu-latest defaults (which can change under us).
      - name: Report runner resources (diagnostic for Gradle memory tuning)
        run: free -h && nproc

      - name: Build regroup Android debug APK
        run: cd regroup/mobile/android && ./gradlew assembleDebug --no-daemon
        env:
          # NOTE: this does NOT override regroup/mobile/android/gradle.properties'
          # org.gradle.jvmargs -- that project-file setting takes precedence over this
          # env var, so this line currently does nothing beyond matching it (both 4g).
          # Raising -Xmx here alone, without also raising gradle.properties, would be a
          # no-op that looks like a fix. Tune memory in gradle.properties instead.
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      # Permanent. The release guard and the e2e bundle settings are attached to Gradle tasks
      # by name (regroup/mobile/android/app/build.gradle), so an AGP, React Native plugin or
      # Sentry rename would drop them silently. app/build.gradle fails the configuration if a
      # name stops matching; this proves the wiring end to end: the guard runs before the
      # release bundle, the e2e bundle gets its own env stamp and no release guard, and the
      # guard refuses a test Stripe key with its own message (not a values.xml parse error).
      - name: Assert regroup Android release and e2e guard wiring
        run: |
          set -euo pipefail
          cd regroup/mobile/android
          release=$(./gradlew :app:assembleRelease --dry-run --no-daemon)
          guard=$(grep -n '^:app:regroupReleaseGuard SKIPPED' <<<"$release" | head -1 | cut -d: -f1 || true)
          bundle=$(grep -n '^:app:createBundleReleaseJsAndAssets SKIPPED' <<<"$release" | head -1 | cut -d: -f1 || true)
          if [ -z "$guard" ] || [ -z "$bundle" ] || [ "$guard" -ge "$bundle" ]; then
            echo "::error::assembleRelease must run regroupReleaseGuard before createBundleReleaseJsAndAssets (guard line '${guard}', bundle line '${bundle}')"
            exit 1
          fi
          e2e=$(./gradlew :app:assembleE2eEmulator --dry-run --no-daemon)
          if ! grep -q '^:app:regroupBundledEnvStampE2eEmulator SKIPPED' <<<"$e2e"; then
            echo "::error::assembleE2eEmulator must run regroupBundledEnvStampE2eEmulator"
            exit 1
          fi
          if grep -q '^:app:regroupReleaseGuard SKIPPED' <<<"$e2e"; then
            echo "::error::assembleE2eEmulator must not run the release guard"
            exit 1
          fi
          set +e
          refusal=$(STRIPE_PUBLISHABLE_KEY=pk_test_x ./gradlew :app:regroupReleaseGuard --no-daemon 2>&1)
          code=$?
          set -e
          tail -n 20 <<<"$refusal"
          if [ "$code" -eq 0 ]; then
            echo "::error::the release guard accepted a pk_test_ Stripe key"
            exit 1
          fi
          if ! grep -q 'Release guard failed' <<<"$refusal" || ! grep -q 'a release build requires a pk_live_ key' <<<"$refusal"; then
            echo "::error::the release guard failed, but not with its Stripe-key refusal"
            exit 1
          fi

      - name: Maestro smoke — regroup (login-and-view-dashboard)
        continue-on-error: true
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: regroup/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          flow-file: e2e-maestro/regroup/login-and-view-dashboard.yaml
          env: |
            E2E_TEST_PASSWORD=${{ secrets.REGROUP_E2E_TEST_PASSWORD }}

  homegroups-maestro-smoke:
    name: Maestro Cloud — smoke tests (homegroups Android)
    needs: [recovery-api, homegroups-functions, regroup-functions, detox-recovery]
    runs-on: ubuntu-latest
    # Only run on PRs — see the comment on the regroup maestro-smoke job above for why
    # this check happens at the step level via `if:`, not the job level.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'e2e-fix/')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install homegroups/mobile dependencies
        run: cd homegroups/mobile && npm ci

      - name: Build homegroups Android debug APK
        run: cd homegroups/mobile/android && ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Maestro smoke — homegroups (invite-code-join)
        continue-on-error: true
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: homegroups/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          flow-file: homegroups/mobile/maestro/flows/invite-code-join.yaml
          env: |
            E2E_TEST_PASSWORD=${{ secrets.HOMEGROUPS_E2E_TEST_PASSWORD }}
