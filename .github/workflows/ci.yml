name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-api:
    name: recovery-api — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: recovery-api/package-lock.json
      - name: Install dependencies
        run: cd recovery-api && npm ci
      - name: Typecheck
        run: cd recovery-api && npx tsc --noEmit
      - name: Test
        run: cd recovery-api && npm test -- --passWithNoTests --forceExit

  homegroups-functions:
