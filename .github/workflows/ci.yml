name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-api:
    name: recovery-api — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: recovery-api/package-lock.json
      - name: Install dependencies
        run: cd recovery-api && npm ci
      - name: Typecheck
        run: cd recovery-api && npx tsc --noEmit
      - name: Test
        run: cd recovery-api && npm test -- --forceExit

  homegroups-functions:
    name: homegroups/functions — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/functions/package-lock.json
      - name: Install dependencies
        run: cd homegroups/functions && npm ci
      - name: Typecheck
        run: cd homegroups/functions && npx tsc --noEmit
      - name: Test
        run: cd homegroups/functions && npm test -- --forceExit

  homegroups-firestore-rules:
    name: homegroups/functions — Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install dependencies
        run: cd homegroups/functions && npm ci
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Run Firestore rules tests
        run: cd homegroups/functions && npm run test:rules

  homegroups-storage-rules:
    name: homegroups/functions — Storage security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install dependencies
        run: cd homegroups/functions && npm ci
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Run Storage rules tests
        run: cd homegroups/functions && npm run test:rules:storage

  homegroups-mobile:
    name: homegroups/mobile — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/mobile/package-lock.json
      - name: Install dependencies
        run: cd homegroups/mobile && npm ci
      - name: Test
        run: cd homegroups/mobile && npm test -- --ci

  homegroups-web:
    name: homegroups/web — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/web/package-lock.json
      - name: Install dependencies
        run: cd homegroups/web && npm ci
      - name: Test
        run: cd homegroups/web && CI=true npm test -- --watchAll=false

  regroup-functions:
    name: regroup/functions — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/functions/package-lock.json
      - name: Install dependencies
        run: cd regroup/functions && npm ci
      - name: Typecheck
        run: cd regroup/functions && npx tsc --noEmit
      - name: Test
        run: cd regroup/functions && npm test -- --forceExit

  regroup-mobile:
    name: regroup/mobile — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/mobile/package-lock.json
      # `npm ci` alone cannot work here. Unlike homegroups/mobile, whose
      # postinstall guards CocoaPods behind `if [ "$(uname)" = "Darwin" ]`,
      # this package runs `pod-install` unconditionally, which fails on Linux.
      # Skipping lifecycle scripts also skips patch-package, and two patches
      # under regroup/mobile/patches are load-bearing, so run it explicitly.
      - name: Install dependencies
        run: cd regroup/mobile && npm ci --ignore-scripts && npx patch-package
      # Ratchet, not a clean-run gate. This package had no typecheck step at all,
      # so it starts from a large pre-existing error count pinned in
      # regroup/mobile/.typecheck-baseline; the step fails only when the count
      # goes UP. If this run's count differs from the baseline purely because CI
      # resolves dependencies differently from a developer machine, set the
      # baseline from a CI run rather than loosening the gate.
      - name: Typecheck (ratchet)
        run: cd regroup/mobile && npm run typecheck:ratchet
      - name: Test
        run: cd regroup/mobile && npm test -- --ci

  regroup-web:
    name: regroup/web — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/web/package-lock.json
      - name: Install dependencies
        run: cd regroup/web && npm ci
      # Deliberately not `npm test`: angular.json points the Karma target at
      # karma.conf.js, which has never existed in this repo, so `ng test`
      # cannot run. The specs do typecheck, so that is what is enforced until
      # someone adds a runner — this job is named "typecheck", not "test", so
      # it does not imply coverage it has not got.
      - name: Typecheck
        run: cd regroup/web && npx tsc --noEmit -p tsconfig.spec.json

  detox-recovery:
    name: detox-recovery — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: detox-recovery/package-lock.json
      - name: Install dependencies
        run: cd detox-recovery && npm ci
      - name: Typecheck
        run: cd detox-recovery && npx tsc --noEmit
      - name: Test
        run: cd detox-recovery && npm test -- --forceExit

  maestro-smoke:
    name: Maestro Cloud — smoke tests (regroup Android)
    needs: [recovery-api, homegroups-functions, regroup-functions, detox-recovery]
    runs-on: ubuntu-latest
    # Only run on PRs — the `secrets` context isn't available in job-level `if:`
    # (only github/inputs/needs/vars are), so the actual Maestro-credit-saving
    # check happens on the Maestro step itself, below.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install regroup/mobile dependencies
        run: cd regroup/mobile && npm ci

      # Diagnostic, kept permanently rather than as a one-off: the Android build has
      # died from an OutOfMemoryError on this job before, and that is only diagnosable
      # against the runner's actual RAM/CPU, not assumed from GitHub's documented
      # ubuntu-latest defaults (which can change under us).
      - name: Report runner resources (diagnostic for Gradle memory tuning)
        run: free -h && nproc

      - name: Build regroup Android debug APK
        run: cd regroup/mobile/android && ./gradlew assembleDebug --no-daemon
        env:
          # NOTE: this does NOT override regroup/mobile/android/gradle.properties'
          # org.gradle.jvmargs -- that project-file setting takes precedence over this
          # env var, so this line currently does nothing beyond matching it (both 4g).
          # Raising -Xmx here alone, without also raising gradle.properties, would be a
          # no-op that looks like a fix. Tune memory in gradle.properties instead.
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Maestro smoke — regroup (login-and-view-dashboard)
        continue-on-error: true
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: regroup/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          flow-file: e2e-maestro/regroup/login-and-view-dashboard.yaml

  homegroups-maestro-smoke:
    name: Maestro Cloud — smoke tests (homegroups Android)
    needs: [recovery-api, homegroups-functions, regroup-functions, detox-recovery]
    runs-on: ubuntu-latest
    # Only run on PRs — see the comment on the regroup maestro-smoke job above for why
    # this check happens at the step level via `if:`, not the job level.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install homegroups/mobile dependencies
        run: cd homegroups/mobile && npm ci

      - name: Build homegroups Android debug APK
        run: cd homegroups/mobile/android && ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Maestro smoke — homegroups (invite-code-join)
        continue-on-error: true
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: homegroups/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          flow-file: homegroups/mobile/maestro/flows/invite-code-join.yaml
