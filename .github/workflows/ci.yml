name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-api:
    name: recovery-api — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: recovery-api/package-lock.json
      - name: Install dependencies
        run: cd recovery-api && npm ci
      - name: Typecheck
        run: cd recovery-api && npx tsc --noEmit
      - name: Test
        run: cd recovery-api && npm test -- --forceExit

  homegroups-functions:
    name: homegroups/functions — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/functions/package-lock.json
      - name: Install dependencies
        run: cd homegroups/functions && npm ci
      - name: Typecheck
        run: cd homegroups/functions && npx tsc --noEmit
      - name: Test
        run: cd homegroups/functions && npm test -- --forceExit

  homegroups-firestore-rules:
    name: homegroups/functions — Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install dependencies
        run: cd homegroups/functions && npm ci
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Run Firestore rules tests
        run: cd homegroups/functions && npm run test:rules

  homegroups-storage-rules:
    name: homegroups/functions — Storage security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install dependencies
        run: cd homegroups/functions && npm ci
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Run Storage rules tests
        run: cd homegroups/functions && npm run test:rules:storage

  homegroups-mobile:
    name: homegroups/mobile — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/mobile/package-lock.json
      - name: Install dependencies
        run: cd homegroups/mobile && npm ci
      - name: Test
        run: cd homegroups/mobile && npm test -- --ci

  homegroups-web:
    name: homegroups/web — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/web/package-lock.json
      - name: Install dependencies
        run: cd homegroups/web && npm ci
      - name: Test
        run: cd homegroups/web && CI=true npm test -- --watchAll=false

  regroup-functions:
    name: regroup/functions — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/functions/package-lock.json
      - name: Install dependencies
        run: cd regroup/functions && npm ci
      - name: Typecheck
        run: cd regroup/functions && npx tsc --noEmit
      - name: Test
        run: cd regroup/functions && npm test -- --forceExit

  regroup-e2e:
    name: regroup/e2e — jest
    runs-on: ubuntu-latest
    # hashFiles() is unavailable in job-level `if:`, so each step is guarded and the
    # job is a no-op until the regroup/e2e package exists on this branch.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: hashFiles('regroup/e2e/package.json') != ''
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/e2e/package-lock.json
      - name: Install dependencies
        if: hashFiles('regroup/e2e/package.json') != ''
        run: cd regroup/e2e && npm ci
      - name: Test
        if: hashFiles('regroup/e2e/package.json') != ''
        run: cd regroup/e2e && npx jest

  regroup-mobile:
    name: regroup/mobile — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/mobile/package-lock.json
      # `npm ci` alone cannot work here. Unlike homegroups/mobile, whose
      # postinstall guards CocoaPods behind `if [ "$(uname)" = "Darwin" ]`,
      # this package runs `pod-install` unconditionally, which fails on Linux.
      # Skipping lifecycle scripts also skips patch-package, and two patches
      # under regroup/mobile/patches are load-bearing, so run it explicitly.
      - name: Install dependencies
        run: cd regroup/mobile && npm ci --ignore-scripts && npx patch-package
      # Ratchet, not a clean-run gate. This package had no typecheck step at all,
      # so it starts from a large pre-existing set of errors, listed one per line
      # in regroup/mobile/.typecheck-baseline; the step fails only when an error
      # appears that is not in that list. If this run's errors differ from the
      # baseline purely because CI resolves dependencies differently from a
      # developer machine, regenerate the baseline from a CI run rather than
      # loosening the gate.
      - name: Typecheck (ratchet)
        run: cd regroup/mobile && npm run typecheck:ratchet
      - name: Test
        run: cd regroup/mobile && npm test -- --ci

  regroup-web:
    name: regroup/web — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/web/package-lock.json
      - name: Install dependencies
        run: cd regroup/web && npm ci
      # Deliberately not `npm test`: karma.conf.js exists and specs run locally
      # (`npm test -- --watch=false --browsers=ChromeHeadless`), but CI only
      # typechecks them. The full suite is not green yet (one known failing
      # CloudFunctionService spec, and the run aborts on an unhandled
      # rejection), so this job is named "typecheck", not "test", and does not
      # imply coverage it has not got.
      - name: Typecheck
        run: cd regroup/web && npx tsc --noEmit -p tsconfig.spec.json
      # The deploy-check scripts (scripts/*.test.js): fixtures only, no build.
      # They guard the predeploy bundle check that keeps staging and production
      # bundles from deploying to the wrong project.
      - name: Deploy-check script tests
        run: cd regroup/web && npm run test:scripts

  regroup-portal:
    name: regroup/portal — test (non-blocking)
    runs-on: ubuntu-latest
    # Until launch finishes, the portal must never block a mobile PR. It runs on
    # every PR so a mobile change that breaks the portal shows up here anyway.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/portal/package-lock.json
      - name: Install dependencies
        run: cd regroup/portal && npm ci
      - name: Typecheck
        run: cd regroup/portal && npm run typecheck
      - name: Unit tests
        run: cd regroup/portal && npx vitest run
      - name: Production build
        run: cd regroup/portal && npm run build -- --production
      - name: Bundle checks
        run: cd regroup/portal && node tools/check-bundle.mjs --warn-versions

  # Which packages a change touches, for jobs that run only when their package changes.
  changes:
    name: changed packages
    runs-on: ubuntu-latest
    outputs:
      portal: ${{ steps.diff.outputs.portal }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # An unknown base (a new branch, a force-push) runs everything.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            portal=true
          elif git diff --name-only "${BASE}...${HEAD}" | grep -qE '^(regroup/portal/|regroup/firebase\.portal\.json$)'; then
            portal=true
          else
            portal=false
          fi
          echo "portal=${portal}" >> "$GITHUB_OUTPUT"

  regroup-portal-e2e:
    name: regroup/portal — browser tests
    needs: changes
    # Blocking, but only for changes to the portal itself, so the portal still never
    # blocks a mobile PR before launch. A skipped job counts as passed.
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            regroup/portal/package-lock.json
            regroup/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install dependencies
        run: cd regroup/portal && npm ci
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Install Chromium
        run: cd regroup/portal && npx playwright install --with-deps chromium
      # The payments journeys call the real functions against the Stripe sandbox.
      - name: Stripe test key for the functions emulator
        env:
          STRIPE_SECRET_KEY: ${{ secrets.REGROUP_PORTAL_E2E_STRIPE_SECRET_KEY }}
        run: |
          case "$STRIPE_SECRET_KEY" in
            "") echo "::error::Add the REGROUP_PORTAL_E2E_STRIPE_SECRET_KEY repository secret, a Stripe test-mode key."; exit 1 ;;
            *_test_*) ;;
            *) echo "::error::REGROUP_PORTAL_E2E_STRIPE_SECRET_KEY must be a test-mode key."; exit 1 ;;
          esac
          umask 077
          printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY" > regroup/functions/.secret.local
      - name: Browser tests
        env:
          # The sandbox's test-mode connected account, which the seed gives each house.
          E2E_STRIPE_ACCOUNT_ID: ${{ secrets.REGROUP_PORTAL_E2E_STRIPE_ACCOUNT_ID }}
        run: |
          if [ -z "$E2E_STRIPE_ACCOUNT_ID" ]; then
            echo "::error::Add the REGROUP_PORTAL_E2E_STRIPE_ACCOUNT_ID repository secret, the sandbox's connected account."
            exit 1
          fi
          regroup/portal/scripts/e2e.sh --production
      - name: Failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regroup-portal-e2e-results
          path: regroup/portal/test-results
          retention-days: 7

  detox-recovery:
    name: detox-recovery — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: detox-recovery/package-lock.json
      - name: Install dependencies
        run: cd detox-recovery && npm ci
      - name: Typecheck
        run: cd detox-recovery && npx tsc --noEmit
      - name: Test
        run: cd detox-recovery && npm test -- --forceExit

  pr-review-checks:
    name: pr-review — project checks and kit validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Project check tests
        run: node --test ".pr-review/checks/test/*.test.mjs"
      # validate runs from the kit commit the review workflow pins, and checks
      # that commit is on the kit's main branch.
      - name: Read the kit pin
        id: kit
        run: |
          sha="$(grep -oE 'marcusk639/pr-review-kit/actions/review@[0-9a-f]{40}' .github/workflows/claude-code-review.yml | head -n 1 | cut -d@ -f2)"
          if [ -z "$sha" ]; then echo "::error::claude-code-review.yml has no full-SHA kit pin"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout pr-review-kit
        uses: actions/checkout@v4
        with:
          repository: marcusk639/pr-review-kit
          ref: main
          path: .pr-review-kit-ci
          fetch-depth: 0
          persist-credentials: false
      - name: Validate .pr-review/ and the review workflow
        env:
          KIT_SHA: ${{ steps.kit.outputs.sha }}
        run: |
          git -C .pr-review-kit-ci checkout -q --detach "$KIT_SHA"
          node .pr-review-kit-ci/bin/pr-review.mjs validate

  # Build-only since 2026-11-06. It used to run a Maestro Cloud flow against this
  # debug APK, whose google-services.json is production (phoenix-cleanhouse): every
  # launch signs in anonymously there. Maestro may only drive .e2e.emu/.e2e.stg
  # builds (regroup launch design §3.4, §4.3); the suite moves to CI later. The
  # job stays because it is CI's only regroup Android compile check, and it carries
  # the permanent release/e2e guard-wiring assertion below (RN 0.88 upgrade).
  regroup-android-build:
    name: regroup/mobile — Android build and guard wiring
    needs: [recovery-api, homegroups-functions, regroup-functions, detox-recovery]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'e2e-fix/')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The RN 0.88 upgrade replaced the binary gradle-wrapper.jar, and every ./gradlew
      # below executes it. Validate every wrapper jar in the checkout against Gradle's
      # published checksums before running any of them (pinned by commit SHA, v6.4.1).
      - name: Validate Gradle wrapper jars
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: regroup/mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install regroup/mobile dependencies
        run: cd regroup/mobile && npm ci

      # Diagnostic, kept permanently rather than as a one-off: the Android build has
      # died from an OutOfMemoryError on this job before, and that is only diagnosable
      # against the runner's actual RAM/CPU, not assumed from GitHub's documented
      # ubuntu-latest defaults (which can change under us).
      - name: Report runner resources (diagnostic for Gradle memory tuning)
        run: free -h && nproc

      - name: Build regroup Android debug APK
        run: cd regroup/mobile/android && ./gradlew assembleDebug --no-daemon
        env:
          # NOTE: this is the heap CI actually uses. A system property in GRADLE_OPTS
          # overrides org.gradle.jvmargs in regroup/mobile/android/gradle.properties
          # (checked on Gradle 8.0.1), so raising -Xmx there alone changes nothing in CI.
          # 6g because :app:mergeExtDexDebug intermittently hit `Java heap space` at 4g:
          # R8 8.1.65 logs a warning and stack trace per class it cannot read Kotlin 2.1
          # metadata for (about 11,000). AGP 9 in the RN 0.88 upgrade has none of these,
          # so re-measure and consider lowering this once that lands.
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx6g"

      # Permanent. The release guard and the e2e bundle settings are attached to Gradle tasks
      # by name (regroup/mobile/android/app/build.gradle), so an AGP, React Native plugin or
      # Sentry rename would drop them silently. app/build.gradle fails the configuration if a
      # name stops matching; this proves the wiring end to end: the guard runs before the
      # release bundle, the e2e bundle gets its own env stamp and no release guard, and the
      # guard refuses a test Stripe key with its own message (not a values.xml parse error).
      - name: Assert regroup Android release and e2e guard wiring
        run: |
          set -euo pipefail
          cd regroup/mobile/android
          release=$(./gradlew :app:assembleRelease --dry-run --no-daemon)
          guard=$(grep -n '^:app:regroupReleaseGuard SKIPPED' <<<"$release" | head -1 | cut -d: -f1 || true)
          bundle=$(grep -n '^:app:createBundleReleaseJsAndAssets SKIPPED' <<<"$release" | head -1 | cut -d: -f1 || true)
          if [ -z "$guard" ] || [ -z "$bundle" ] || [ "$guard" -ge "$bundle" ]; then
            echo "::error::assembleRelease must run regroupReleaseGuard before createBundleReleaseJsAndAssets (guard line '${guard}', bundle line '${bundle}')"
            exit 1
          fi
          e2e=$(./gradlew :app:assembleE2eEmulator --dry-run --no-daemon)
          if ! grep -q '^:app:regroupBundledEnvStampE2eEmulator SKIPPED' <<<"$e2e"; then
            echo "::error::assembleE2eEmulator must run regroupBundledEnvStampE2eEmulator"
            exit 1
          fi
          if grep -q '^:app:regroupReleaseGuard SKIPPED' <<<"$e2e"; then
            echo "::error::assembleE2eEmulator must not run the release guard"
            exit 1
          fi
          set +e
          refusal=$(STRIPE_PUBLISHABLE_KEY=pk_test_x ./gradlew :app:regroupReleaseGuard --no-daemon 2>&1)
          code=$?
          set -e
          tail -n 20 <<<"$refusal"
          if [ "$code" -eq 0 ]; then
            echo "::error::the release guard accepted a pk_test_ Stripe key"
            exit 1
          fi
          if ! grep -q 'Release guard failed' <<<"$refusal" || ! grep -q 'a release build requires a pk_live_ key' <<<"$refusal"; then
            echo "::error::the release guard failed, but not with its Stripe-key refusal"
            exit 1
          fi

  homegroups-maestro-smoke:
    name: Maestro Cloud — smoke tests (homegroups Android)
    needs: [recovery-api, homegroups-functions, regroup-functions, detox-recovery]
    runs-on: ubuntu-latest
    # Only run on PRs — the `secrets` context isn't available in job-level `if:`
    # (only github/inputs/needs/vars are), so the actual Maestro-credit-saving
    # check happens on the Maestro step itself, below.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'e2e-fix/')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: homegroups/mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install homegroups/mobile dependencies
        run: cd homegroups/mobile && npm ci

      - name: Build homegroups Android debug APK
        run: cd homegroups/mobile/android && ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Maestro smoke — homegroups (invite-code-join)
        continue-on-error: true
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: homegroups/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          flow-file: homegroups/mobile/maestro/flows/invite-code-join.yaml
          env: |
            E2E_TEST_PASSWORD=${{ secrets.HOMEGROUPS_E2E_TEST_PASSWORD }}
