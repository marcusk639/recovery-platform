# Repo-aware, advisory PR review (marcusk639/pr-review-kit). Comments only:
# never approves, never blocks, never a required check. The engine, the
# model's sandbox and publishing live in the kit, pinned below by full commit
# SHA (the same in both kit `uses:` lines; move both together and run the
# kit's `bin/pr-review.mjs validate`). This repository's project (config,
# knowledge, contract checks, Serena config) is .pr-review/, read from each
# PR's base commit. How it works: docs/ci/pr-review.md.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skipped for drafts; for agent-authored e2e-fix/* PRs, whose head an agent
    # wrote, so it must never steer this secret-bearing job; and for fork and
    # Dependabot PRs, whose pull_request runs get no secrets, so publish could
    # not post anyway.
    if: >-
      ${{ !github.event.pull_request.draft
      && !startsWith(github.head_ref, 'e2e-fix/')
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Facts, then the sandboxed model. Gets the Claude token and nothing else.
      # Serena code navigation is opt-in through the repository variable
      # PR_REVIEW_SERENA=on (config: .pr-review/serena/).
      - name: Review
        id: review
        uses: marcusk639/pr-review-kit/actions/review@6a0448d58950325d8c1995a94c201a7e8934c035
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          serena: ${{ vars.PR_REVIEW_SERENA }}

      # Model-free; the only step with the ledger id key and the advisory token
      # (fine-grained PAT, "Repository security advisories: Read and write" on
      # this repository). It refuses to run if a Serena process survived.
      - name: Publish
        if: always()
        uses: marcusk639/pr-review-kit/actions/publish@6a0448d58950325d8c1995a94c201a7e8934c035
        with:
          trust_sha: ${{ steps.review.outputs.trust_sha }}
          action_outcome: ${{ steps.review.outputs.outcome }}
          execution_file: ${{ steps.review.outputs.execution_file }}
          id_key: ${{ secrets.PR_REVIEW_ID_KEY }}
          advisory_token: ${{ secrets.SECURITY_ADVISORY_TOKEN }}
