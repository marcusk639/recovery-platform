name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, agent-authored e2e-fix/* PRs (they never get the
    # secret-bearing review job) and forks.
    if: >-
      ${{ !github.event.pull_request.draft
      && !startsWith(github.head_ref, 'e2e-fix/')
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      OUT: ${{ runner.temp }}/pr-review
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout base (trusted scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-base
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Facts
        id: facts
        run: |
          mkdir -p "$OUT"
          echo "tier=full" >> "$GITHUB_OUTPUT"
          echo "max_turns=10" >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"disableAllHooks": true}'
          prompt: |
            Post exactly one inline comment on the first changed line of this
            pull request. The comment body must be the text
            "pr-review skeleton check" followed by the hidden marker
            <!-- pr-review:fp=c0:skeleton:check -->
            Then write the file $OUT/findings.json with exactly this content:
            {"reviewedSha":"${{ github.event.pull_request.head.sha }}","findings":[],"resolvedSlugs":[]}
          claude_args: >-
            --model opus
            --max-turns ${{ steps.facts.outputs.max_turns }}
            --strict-mcp-config
            --allowedTools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*)"
            --disallowedTools "Edit,WebFetch,WebSearch"

      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ -f .review-base/.claude/pr-review/checks/publish.mjs ]; then
            node .review-base/.claude/pr-review/checks/publish.mjs
          else
            echo "pr-review scripts not on base yet"
          fi

      - name: Cleanup
        if: always()
        run: rm -rf "$OUT"
