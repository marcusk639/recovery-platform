name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, agent-authored e2e-fix/* PRs (they never get the
    # secret-bearing review job) and forks.
    if: >-
      ${{ !github.event.pull_request.draft
      && !startsWith(github.head_ref, 'e2e-fix/')
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      OUT: ${{ runner.temp }}/pr-review
      # Trusted copy of state.json, outside the model's --add-dir.
      STATE_FILE: ${{ runner.temp }}/prstate-snapshot/state.json
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout base (trusted scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-base
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Facts
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -f .review-base/.claude/pr-review/checks/facts.mjs ]; then
            node .review-base/.claude/pr-review/checks/facts.mjs
          else
            echo "pr-review scripts not on base yet"
            mkdir -p "$OUT"
            echo "tier=full" >> "$GITHUB_OUTPUT"
            echo "max_turns=10" >> "$GITHUB_OUTPUT"
          fi

      # The model reads REVIEW.md and the knowledge files from the working tree,
      # so replace the PR head's copy with the base branch's: a PR must not edit
      # the rules it is judged by.
      - name: Restore reviewer knowledge from base
        run: |
          if [ -d .review-base/.claude/pr-review ]; then
            if [ -L .claude ]; then rm .claude; fi
            mkdir -p .claude
            rm -rf .claude/pr-review
            cp -R .review-base/.claude/pr-review .claude/pr-review
          fi

      - name: Review
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"disableAllHooks": true}'
          prompt: |
            Follow .claude/pr-review/REVIEW.md. OUT=${{ runner.temp }}/pr-review. Base ${{ github.event.pull_request.base.sha }}, head ${{ github.event.pull_request.head.sha }}. Ignore the .review-base/ and .review-publish/ directories.
          claude_args: >-
            --model opus
            --max-turns ${{ steps.facts.outputs.max_turns || 10 }}
            --strict-mcp-config
            --add-dir ${{ runner.temp }}/pr-review
            --allowedTools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*)"
            --disallowedTools "Edit,WebFetch,WebSearch"

      - name: Checkout base (publish scripts, untouched by the model)
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-publish
          fetch-depth: 1
          persist-credentials: false

      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTION_OUTCOME: ${{ steps.review.outcome }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          # Publish only: keys the ledger's opaque ids. Never given to facts or the model.
          PR_REVIEW_ID_KEY: ${{ secrets.PR_REVIEW_ID_KEY }}
        run: |
          if [ -f .review-publish/.claude/pr-review/checks/publish.mjs ]; then
            node .review-publish/.claude/pr-review/checks/publish.mjs
          else
            echo "pr-review scripts not on base yet"
          fi

      - name: Cleanup
        if: always()
        run: |
          chmod -R u+w "${{ runner.temp }}/prstate-snapshot" 2>/dev/null || true
          rm -rf "$OUT" "${{ runner.temp }}/prstate-snapshot"
